const HINT_FALLBACK = (label) =>
  label.toLowerCase().replace(/[^a-z ]/g, " ").split(" ").filter((w) => w.length > 4);

function snippet(text, hint) {
  const i = text.toLowerCase().indexOf(hint.toLowerCase());
  if (i < 0) return "";
  const start = Math.max(0, i - 28), end = Math.min(text.length, i + hint.length + 28);
  return (start > 0 ? "…" : "") + text.slice(start, end).replace(/\s+/g, " ").trim() + (end < text.length ? "…" : "");
}

function detectSignals(transcript, rubric) {
  const lc = transcript.toLowerCase();
  const out = [];
  rubric.signals.forEach((sig) => {
    const hints = sig.hints && sig.hints.length ? sig.hints : HINT_FALLBACK(sig.label);
    const hit = hints.find((h) => lc.includes(h.toLowerCase()));
    if (hit) out.push({ id: sig.id, label: sig.label, weight: sig.weight, evidence: snippet(transcript, hit) });
  });
  return out;
}

function detectNextStep(transcript) {
  return /(monday|tuesday|wednesday|thursday|friday|next week)[^.]*(work|good|fine|sure|great)|send (it|the deck|across)|calendar invite/i.test(transcript);
}

function applyBanding(detected, nextStep) {
  const hot = detected.filter((d) => d.weight === "hot").length;
  const warm = detected.filter((d) => d.weight === "warm").length;
  const cold = detected.filter((d) => d.weight === "cold").length;
  if (hot >= 1 && nextStep) return "hot";
  if (warm >= 1 && cold === 0) return "warm";
  if (hot >= 1) return "warm";
  return "cold";
}

function buildRationale(detected, band, nextStep) {
  const hot = detected.filter((d) => d.weight === "hot").map((d) => d.label);
  const warm = detected.filter((d) => d.weight === "warm").map((d) => d.label);
  const parts = [];
  if (hot.length) parts.push(`${hot.length} hot signal${hot.length > 1 ? "s" : ""} (${hot.join("; ")})`);
  if (warm.length) parts.push(`${warm.length} warm signal${warm.length > 1 ? "s" : ""}`);
  const base = parts.length ? parts.join(" and ") : "no qualifying signals";
  return `Detected ${base}; ${nextStep ? "a next step was agreed" : "no next step agreed"} → scored ${band.toUpperCase()} per the banding rule.`;
}

function buildNarrative(band, company, detected, hasNextStep) {
  const c = company || "the roastery";
  const hot = detected.filter((d) => d.weight === "hot").map((d) => d.label.toLowerCase());
  const warm = detected.filter((d) => d.weight === "warm").map((d) => d.label.toLowerCase());
  if (band === "hot") {
    const painLine = hot.length
      ? `The founder walked through their current channel and where it's breaking down, describing clear pain around ${hot.slice(0, 2).join(" and ")}.`
      : `The founder walked through their current channel and where it's breaking down, describing several pain points the platform is built to address.`;
    const nextLine = hasNextStep
      ? `A concrete 30-minute follow-up was agreed for next week, with the onboarding walkthrough and sample listings to land beforehand.`
      : `The team is close to a follow-up commitment, though nothing was placed on the calendar yet.`;
    return `${c} presented a strong buying case in this conversation, with the founder speaking openly about what isn't working today. ${painLine} Kaffea-X mapped its onboarding motion to the gaps raised, and the discussion moved past introductions into specifics quickly. ${nextLine} Scored HOT because multiple qualifying signals fired against the rubric and a committed next step landed on the call.`;
  }
  if (band === "warm") {
    const sigLine = warm.length
      ? `Signals around ${warm.slice(0, 2).join(" and ")} came up naturally, and the team took time to describe how they work today.`
      : `A handful of secondary signals came up, and the team took time to describe how they work today.`;
    const nextLine = hasNextStep
      ? `A lighter-touch follow-up was agreed — an overview to review at their own pace, with an open door to a deeper walkthrough later.`
      : `No firm follow-up was set, but the door was left open for the team to reconnect on their own timing.`;
    return `${c} is exploring the space with real intent, though the buying case isn't fully framed yet. ${sigLine} Kaffea-X shared what a fit would look like without leaning into a hard pitch, and the conversation had genuine give-and-take. ${nextLine} Scored WARM because the interest is real but the top-tier buying trigger hasn't fired.`;
  }
  return `${c} joined the conversation but no qualifying signals surfaced against the rubric. The team isn't in an active evaluation window right now, and the discussion stayed at the level of general orientation to the platform. Kaffea-X shared context on how the product works without pushing for a commitment, and the tone remained informational throughout. No next step was agreed on the call and no material was requested in follow-up. Scored COLD — worth keeping the relationship warm through occasional updates, but not worth active pursuit at this time.`;
}

function buildRecap(band, company) {
  const c = company || "your roastery";
  if (band === "hot")
    return {
      subject: `Next steps for ${c} on Kaffea-X`,
      body: `Hi,\n\nGreat speaking today — the distribution and pricing-visibility gaps you described are exactly what Kaffea-X is built to close. As promised, I'll send a short onboarding walkthrough with sample listings so you can see how ${c}'s lots would appear to buyers.\n\nI've got us down for 30 minutes Thursday next week — calendar invite to follow.\n\nBest,\nMohan`,

      body: `Hi,\n\nThanks for the conversation today. I'm attaching an overview of how Kaffea-X helps roasters like ${c} reach buyers and benchmark pricing. Have a look when it's convenient and let me know if a walkthrough would help.\n\nBest,\nMohan`,

  };
}

async function runProcessing(transcript, rubric) {
  // Simulated model latency — no external request is made.
  await new Promise((r) => setTimeout(r, 900 + Math.random() * 500));
  const detected = detectSignals(transcript, rubric);
  const nextStep = detectNextStep(transcript);
  const band = applyBanding(detected, nextStep);
  const company = CURATED.contact.company.value;
  return normalize({
    contact: CURATED.contact,
    summary: {
      ...CURATED.summary,
      narrative: buildNarrative(band, company, detected, nextStep),
    },
    lead_score: {
      band,
      detected_signals: detected.map(({ id, label, evidence, weight }) => ({ id, label, evidence, weight })),
      rationale: buildRationale(detected, band, nextStep),
    },
    recap_email: buildRecap(band, company),
  });
}

function normalize(p) {
  const cf = (o) => ({ value: o?.value || "", confidence: o?.confidence || "low" });
  return {
    contact: {
      name: cf(p.contact?.name), company: cf(p.contact?.company),
      title: cf(p.contact?.title), email: cf(p.contact?.email),
    },
    summary: {
      meeting_title: p.summary?.meeting_title || "",
      narrative: p.summary?.narrative || "",
      attendees: p.summary?.attendees || [],
      topics: p.summary?.topics || [],
      decisions: p.summary?.decisions || [],
      open_questions: p.summary?.open_questions || [],
      next_steps: p.summary?.next_steps || [],
      commitments: p.summary?.commitments || [],
    },
    lead_score: {
      band: BAND[p.lead_score?.band] ? p.lead_score.band : "cold",
      detected_signals: p.lead_score?.detected_signals || [],
      rationale: p.lead_score?.rationale || "",
    },
    recap_email: { subject: p.recap_email?.subject || "", body: p.recap_email?.body || "" },
  };
}

function ChatPanel({ context, onClose }) {
  const initial = [{
    role: "ai",
    text: `I've analyzed the meeting. ${context.company || "This lead"} shows ${context.signals || "distribution and pricing-transparency signals"}. What would you like to know?`,
  }];
  const [messages, setMessages] = useState(initial);
  const [text, setText] = useState("");
  const [pending, setPending] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, pending]);

  function cannedResponse(q) {
    const lc = q.toLowerCase();
    if (lc.includes("pric")) return "They said they have no visibility on wholesale pricing — cold-emailing cafes without benchmarks means they're either too expensive or leaving money on the table. That's a wholesale-gap Kaffea-X closes directly with the marketplace pricing view.";
    if (lc.includes("next") || lc.includes("step") || lc.includes("follow")) return "Two commitments landed on the call: Mohan will send the onboarding walkthrough with sample listings, and the follow-up is a 30-min call Thursday next week. The calendar invite is Mohan's action to send.";
    if (lc.includes("competitor") || lc.includes("compet")) return "No competing platforms named on the call. Their current 'channel' is farmers markets and a trickle of online orders — the pain is the absence of a channel, not competition between channels.";
    if (lc.includes("budget") || lc.includes("spend")) return "Budget was mentioned but not sized — 'set aside some budget, nothing huge, but we're serious.' That's a WARM signal in the rubric, not HOT. Worth confirming a number before the Thursday call.";
    if (lc.includes("timeline") || lc.includes("when")) return "They want something in place before the fall buying season — 'realistically the next six to eight weeks.' Concrete enough to score as a warm timeline signal.";
    return "Let me check the transcript… based on what was said, the strongest signals are distribution pain, price-transparency pain, and a listing/marketplace need. Anything specific you want me to pull evidence for?";
  }

  function send(msg) {
    const q = (msg ?? text).trim();
    if (!q || pending) return;
    setMessages((m) => [...m, { role: "user", text: q }]);
    setText("");
    setPending(true);
    window.setTimeout(() => {
      setMessages((m) => [...m, { role: "ai", text: cannedResponse(q) }]);
      setPending(false);
    }, 600);
  }

  const chips = [
    "What pricing did they mention?",
    "Any competitor references?",
    "Summarize next steps",
  ];

  return (
    <aside className="kx-chat">
      <div className="kx-chat-header-row">
        <div style={{ minWidth: 0, flex: 1 }}>
          <div className="kx-chat-eyebrow">Follow-up</div>
          <div className="kx-chat-title">Ask about this lead</div>
          <div style={{ width: 72, height: 6, background: "var(--bright-blue)", borderRadius: 2, marginBottom: 16 }} />
        </div>
        {onClose && (
          <button
            className="kx-chat-close"
            onClick={onClose}
            title="Close chat"
            aria-label="Close chat"
          >
            <X size={14} />
          </button>
        )}
      </div>

      <div className="kx-chat-messages" ref={scrollRef}>
        {messages.map((m, i) => (
          <React.Fragment key={i}>
            {m.role === "ai" ? (
              <div className="kx-chat-row-ai">
                <div className="kx-chat-avatar">
                  <img src="favicon.png" alt="Kaffea-X" />
                </div>
                <div className="kx-chat-bubble-ai">{m.text}</div>
              </div>
            ) : (
              <div className="kx-chat-row-user">
                <div className="kx-chat-bubble-user">{m.text}</div>
              </div>
            )}
            {/* Suggested prompts appear inline right after the first AI greeting.
                They scroll away naturally once the conversation grows. */}
            {i === 0 && m.role === "ai" && (
              <>
                <div className="kx-chat-chips-eyebrow">Suggested</div>
                <div className="kx-chat-chips">
                  {chips.map((c, ci) => (
                    <button key={ci} className="kx-chat-chip" onClick={() => send(c)}>{c}</button>
                  ))}
                </div>
              </>
            )}
          </React.Fragment>
        ))}
        {pending && (
          <div className="kx-chat-row-ai">
            <div className="kx-chat-avatar">
              <img src="favicon.png" alt="Kaffea-X" />
            </div>
            <div className="kx-chat-bubble-ai" style={{ color: "var(--muted)", fontStyle: "italic" }}>Thinking…</div>
          </div>
        )}
      </div>

      <div className="kx-chat-input-bar">
        <input
          className="kx-chat-input"
          type="text"
          placeholder="Ask a follow-up question..."
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); }}
        />
        <button className="kx-chat-send" onClick={() => send()} title="Send">
          <Send size={16} />
        </button>
      </div>
    </aside>
  );
}

/* ---------------- Breadcrumb navigation (replaces the numbered stepper) ---------------- */
function Stepper({ step, draftReady, activeCommitted, goTo }) {
  const steps = [
    { key: "capture", label: "Capture" },
    { key: "review",  label: "Review"  },
    { key: "commit",  label: "CRM"     },
  ];
  const reachable = {
    capture: true,
    review:  draftReady || activeCommitted,
    commit:  activeCommitted,
  };

  return (
    <nav className="kx-breadcrumb" aria-label="Progress">
      {steps.map((s, i) => {
        const active = s.key === step;
        const disabled = !reachable[s.key] && !active;
        return (
          <React.Fragment key={s.key}>
            <button
              className={"kx-crumb" + (active ? " active" : "")}
              onClick={() => !disabled && !active && goTo(s.key)}
              disabled={disabled}
              aria-current={active ? "page" : undefined}
              title={disabled ? "Not yet reachable" : `Go to ${s.label}`}
            >
              {s.label}
            </button>
            {i < steps.length - 1 && <span className="kx-crumb-sep" aria-hidden="true">›</span>}
          </React.Fragment>
        );
      })}
    </nav>
  );
}

function CommitmentsEditor({ value, onChange }) {
  const items = value || [];
  function update(i, key, val) { const arr = structuredClone(items); arr[i][key] = val; onChange(arr); }
  function remove(i) { const arr = structuredClone(items); arr.splice(i, 1); onChange(arr); }
  function add() { onChange([...(items || []), { side: "kaffea_x", description: "" }]); }
  return (
    <div>
      <div style={{ fontSize: 10, fontWeight: 800, color: "var(--midnight)",
        marginBottom: 4, textTransform: "uppercase", letterSpacing: 0.5 }}>Commitments</div>
      {items.length === 0 && <span style={{ fontSize: 11, color: "var(--muted)" }}>None detected.</span>}
      {items.map((c, i) => (
        <div key={i} style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 4 }}>
          <select
            value={c.side}
            onChange={(e) => update(i, "side", e.target.value)}
            style={{ fontSize: 10, fontWeight: 700, padding: "6px 6px", borderRadius: 4,
              border: "1px solid var(--border-warm)",
              color: c.side === "kaffea_x" ? "var(--midnight)" : "var(--mustard)",
              background: "#fff", outline: "none" }}
          >
            <option value="kaffea_x">Kaffea-X</option>
            <option value="prospect">Prospect</option>
          </select>
          <input
            value={c.description}
            placeholder="What was promised"
            onChange={(e) => update(i, "description", e.target.value)}
            className="kx-input"
            style={{ flex: 1, fontSize: 11.5 }}
          />
          <button onClick={() => remove(i)} style={{ background: "none", border: "none", color: "var(--muted)", cursor: "pointer" }}>
            <Trash2 size={13} />
          </button>
        </div>
      ))}
      <button onClick={add} className="kx-btn kx-btn-ghost" style={{ marginTop: 4, padding: "6px 10px", fontSize: 11 }}>
        <Plus size={12} /> Add commitment
      </button>
    </div>
  );
}

/* ---------------- Review dossier screen ---------------- */
function ReviewScreen({ draft, patch, band, committed, onApprove, onReject }) {

  const scoreValue = SCORE_BY_BAND[draft.lead_score.band] ?? Math.min(100, signalCount * 20);

  const emailValue = (draft.contact && draft.contact.email && draft.contact.email.value) || "";
  const emailMissing = !emailValue.trim();
  const emailRef = useRef(null);

  const sendEmail = () => {
    const s = draft.recap_email.subject || "";
    const b = draft.recap_email.body || "";

  };

  return (
    <div className="kx-review">
      {/* Hero block — left column holds SUMMARY eyebrow + meeting title (tight);
          right column holds action buttons. When the title wraps, it grows down
          within the left column, never opening a gap under the eyebrow. */}
      <div className="kx-review-hero-block-wrap">
        <div className="kx-review-hero-block-main">
          <div className="kx-eyebrow">Meeting summary</div>
          <div className="kx-review-hero-row">
            <h1 className="kx-h1">
              {draft.summary.meeting_title
                || (draft.contact.company.value ? buildMeetingTitle(draft.lead_score.band, draft.contact.company.value) : "Untitled meeting")}
              <span className="kx-h1-scorepack">
                <span className={"kx-badge " + band.cls}>{band.label}</span>
                <span className={"kx-score-num " + band.cls} title="Lead score against the rubric">
                  <b>{scoreValue}</b><span className="kx-score-total">/100</span>
                </span>
              </span>
            </h1>
          </div>
        </div>

        <div className="kx-review-actions">
          <button className="kx-btn kx-btn-sm kx-btn-send" onClick={sendEmail} title="Send recap email">
            <Mail size={11} /> Email
          </button>
          {committed ? (
            <button
              className="kx-btn kx-btn-sm kx-btn-approve"
              onClick={onApprove}
              disabled={emailMissing}
              title={emailMissing ? "Prospect email is required to update the CRM record" : "Update the CRM record"}
            >
              <RefreshCw size={11} /> Update CRM
            </button>
          ) : (
            <>
              <button className="kx-btn kx-btn-sm kx-btn-reject" onClick={onReject}>Reject</button>
              <button
                className="kx-btn kx-btn-sm kx-btn-approve"
                onClick={onApprove}
                disabled={emailMissing}
                title={emailMissing ? "Prospect email is required to create the CRM record" : "Approve and write to CRM"}
              >
                Approve
              </button>
            </>
          )}
        </div>
      </div>

      {/* Attendees · date · prospect email — meta strip. The email input is mandatory
          for CRM commit; Approve stays disabled until it's filled. */}
      <div className="kx-meta-inline">
        {attendees.length > 0 && (
          <>
            <span className="kx-meta-attendees" title="Attendees">
              <Users size={14} color="var(--muted)" />
              <span className="kx-meta-attendee-names">{attendeeNames}</span>
            </span>
            <span className="kx-meta-dot" aria-hidden="true" />
          </>
        )}
        <span className="kx-meta-date">June 24, 2026</span>
        <span className="kx-meta-dot" aria-hidden="true" />
        <span className="kx-meta-email" title="Prospect email — required for CRM entry">
          <Mail size={13} className="kx-meta-email-icon" />
          <span className="kx-meta-email-star" aria-hidden="true">*</span>
          <input
            ref={emailRef}
            type="email"
            value={emailValue}
            placeholder="name@company.com"
            onChange={(e) => patch("contact.email.value", e.target.value)}

            aria-label="Prospect email (required for CRM)"
            aria-required="true"
          />

      </div>

      {/* Summary — generated narrative paragraph */}

          {draft.summary.narrative || "Meeting recap will appear here."}
        </div>
      </section>

      {/* What we heard — signals grouped by weight.
          Three columns spatially encode HOT / WARM / COLD. Hover a row
          to reveal the transcript snippet that fired the signal.
          Reasoning footer surfaces the AI's read of the composite band. */}
      <section className="kx-review-section">
        {(() => {
          const signals = draft.lead_score.detected_signals || [];
          const band = draft.lead_score.band || "cold";
          const buckets = { hot: [], warm: [], cold: [] };
          signals.forEach((s) => {
            const w = (s.weight && buckets[s.weight]) ? s.weight : band;
            (buckets[w] || buckets.cold).push(s);
          });
          const total = signals.length;
          const bandLabel = (BAND[band] && BAND[band].label) || band.toUpperCase();
          const cols = [
            { key: "hot",  title: "▲ Hot",  items: buckets.hot },
            { key: "warm", title: "● Warm", items: buckets.warm },

                        c.items.map((s, i) => (

                            {s.label}

                              <span className="kx-heard-evidence">{s.evidence}</span>

                        ))
                      )}
                    </ul>
                  </div>
                ))}
              </div>
            </>
          );
        })()}
      </section>

      {/* What was covered + What was decided — side-by-side, Option B card treatment */}
      <section className="kx-review-section">
        <div className="kx-b-pair">
          <div className="kx-b-pair-col">
            <div className="kx-section-head">
              <div>
                <h2 className="kx-h2-sm">What was covered</h2>
              </div>
            </div>
            {(draft.summary.topics || []).length === 0 ? (
              <div className="kx-b-empty">No topics captured.</div>
            ) : (
              <div className="kx-b-card">
                <ul>
                  {(draft.summary.topics || []).map((t, i) => (
                    <li key={i}>
                      <span className="kx-b-num topic">{String(i + 1).padStart(2, "0")}</span>
                      <span>{t}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>

          <div className="kx-b-pair-col">
            <div className="kx-section-head">
              <div>
                <h2 className="kx-h2-sm">What was decided</h2>
              </div>
            </div>
            {(draft.summary.decisions || []).length === 0 ? (
              <div className="kx-b-empty">No decisions captured.</div>
            ) : (
              <div className="kx-b-card">
                <ul>
                  {(draft.summary.decisions || []).map((d, i) => (
                    <li key={i}>
                      <span className="kx-b-num decision">✓</span>
                      <span>{d}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>
        </div>
      </section>

      {/* Action items — one unified table combining next_steps + commitments.
          Same list treatment as "What was covered" for visual consistency.
          Each row reads: [num]  Owner: action item — due_date */}
      <section className="kx-review-section">
        <div className="kx-section-head">
          <div>
            <h2 className="kx-h2-sm">Action items</h2>
          </div>
        </div>
        {(() => {
          const actionItems = [
            ...(draft.summary.next_steps || []).map((ns) => ({
              owner: ns.owner || null,
              text: ns.description,
              due_date: ns.due_date || null,
            })),
            ...(draft.summary.commitments || []).map((c) => ({
              owner: SIDE_LABEL[c.side] || c.side || null,
              text: c.description,
              due_date: null,
            })),
          ];
          if (actionItems.length === 0) {
            return <div className="kx-b-empty">No action items captured.</div>;
          }
          return (
            <div className="kx-b-card">
              <ul>
                {actionItems.map((it, i) => (
                  <li key={i}>
                    <span className="kx-b-num action">{String(i + 1).padStart(2, "0")}</span>
                    <span className="kx-action-body">
                      <span className="kx-action-text">
                        {it.owner && <b className="kx-action-owner">{it.owner}:</b>}{" "}
                        {it.text}
                      </span>
                      {it.due_date && <span className="kx-due-tag kx-action-due-chip">{it.due_date}</span>}
                    </span>
                  </li>
                ))}
              </ul>
            </div>
          );
        })()}
      </section>

    </div>
  );
}

  return (
    <div className="kx-contact-compact">
      <span className="kx-contact-item name">
        <User size={13} className="kx-contact-icon" />
        {editingName || (!hasName && c.name.confidence === "low") ? (
          <input
            autoFocus={editingName}
            value={c.name.value}
            placeholder="Contact name"
            onChange={(e) => patch("contact.name.value", e.target.value)}
            onBlur={() => setEditingName(false)}

        </>

      <span className="kx-contact-sep" aria-hidden="true">·</span>
      <span className="kx-contact-item">
        <Mail size={13} className="kx-contact-icon" />
        {editingEmail || (!hasEmail && c.email.confidence === "low") ? (
          <input
            autoFocus={editingEmail}
            type="email"
            value={c.email.value}

function RecapLetter({ draft, patch }) {
  const [edit, setEdit] = useState(false);

  function copy() {
    const text = `Subject: ${draft.recap_email.subject}\n\n${draft.recap_email.body}`;
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        setCopied(true);
        window.setTimeout(() => setCopied(false), 1600);
      });

  return (
    <section className="kx-review-section">
      <div className="kx-section-head">
        <div>
          <div className="kx-eyebrow-inline">Recap email</div>
          <h2 className="kx-h2-sm">Draft</h2>
        </div>
        <div className="kx-section-actions">
          <button className="kx-link-btn" onClick={copy}>{copied ? "Copied" : "Copy"}</button>
          <button className="kx-link-btn" onClick={() => setEdit((v) => !v)}>{edit ? "Done" : "Edit"}</button>
        </div>
      </div>
      {edit ? (
        <div>
          <input
            value={draft.recap_email.subject}
            onChange={(e) => patch("recap_email.subject", e.target.value)}
            className="kx-input"
            style={{ fontWeight: 600, marginBottom: 8 }}
          />
          <textarea
            value={draft.recap_email.body}
            onChange={(e) => patch("recap_email.body", e.target.value)}
            className="kx-textarea"
            style={{ height: 200, fontSize: 13 }}
          />
        </div>
      ) : (
        <div className="kx-letter">
          <div className="kx-letter-subject">{draft.recap_email.subject}</div>
          <hr className="kx-letter-rule" />
          <div className="kx-letter-body">{draft.recap_email.body}</div>
        </div>
      )}
    </section>
  );
}

            <React.Fragment key={i}>
              <div className={"kx-proc-row " + state}>
                <div className={"kx-proc-icon " + state}>

                <div className={"kx-proc-label " + state}>{s.label}</div>
                <div className="kx-proc-status">
                  {state === "active" && <span style={{ color: "var(--mustard)", fontWeight: 700, letterSpacing: 2 }}>…</span>}
                  {state === "done" && (
                    <span style={{ color: "var(--green-deep)", fontSize: 11, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4 }}>
                      <Check size={12} color="var(--green-deep)" /> done
                    </span>
                  )}
                </div>
              </div>
              {state === "active" && (
                <div className="kx-proc-shimmers">
                  <div className="kx-shimmer" style={{ width: "85%" }} />
                  <div className="kx-shimmer" style={{ width: "65%" }} />
                  <div className="kx-shimmer" style={{ width: "45%" }} />
                </div>
              )}
            </React.Fragment>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------- main component ---------------- */
function KaffeaXPOC() {
  const [transcript, setTranscript] = useState(SAMPLE);
  const [rubric, setRubric] = useState(DEFAULT_RUBRIC);
  const [status, setStatus] = useState("idle"); // idle | processing | review | error
  const [draft, setDraft] = useState(null);
  const [error, setError] = useState("");
  const [crm, setCrm] = useState(() => SEED_LIBRARY.filter((r) => r.committed).map((r) => ({
    id: r.id, contact: r.contact, band: r.band, rationale: r.lead_score.rationale,
    recap: r.recap_email, nextSteps: r.summary.next_steps, at: new Date(),
  })));
  const [audit, setAudit] = useState([]);
  const [library, setLibrary] = useState(() => SEED_LIBRARY);
  const [activeId, setActiveId] = useState(null);
  const [toast, setToast] = useState(null);
  const [step, setStep] = useState("capture"); // capture | review | commit
  const [procTick, setProcTick] = useState(0);
  const [addingSignal, setAddingSignal] = useState(false);
  const [newSignalLabel, setNewSignalLabel] = useState("");
  const [newSignalWeight, setNewSignalWeight] = useState("warm");
  const [rubricOpen, setRubricOpen] = useState(false);
  const fileInputRef = useRef(null);

  const activeRecord = library.find((r) => r.id === activeId) || null;
  const isCommitted = !!(activeRecord && activeRecord.committed);

  function openFromLibrary(record) {
    setDraft(record);
    setActiveId(record.id);
    setStep("review");
    setStatus("idle");
    setError("");
  }

  function saveNewSignal() {
    const label = newSignalLabel.trim();
    if (!label) return;
    setRubric((r) => ({
      ...r,
      signals: [...r.signals, { id: "custom_" + Date.now(), label, weight: newSignalWeight }],
    }));
    setNewSignalLabel("");
    setNewSignalWeight("warm");
    setAddingSignal(false);
  }
  function cancelNewSignal() {
    setNewSignalLabel("");
    setNewSignalWeight("warm");
    setAddingSignal(false);
  }

  function handleFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => setTranscript(String(reader.result || ""));
    reader.readAsText(f);
    e.target.value = "";
  }


  function notify(message, tone = "success") {
    setToast({ message, tone });
    window.clearTimeout(window.__kxToastTimer);
    window.__kxToastTimer = window.setTimeout(() => setToast(null), 3200);
  }

  function goTo(target) {
    if (!["capture", "review", "commit"].includes(target)) return;
    if (target === "review" && !draft) return;
    // Step 3 is only reachable when the ACTIVE record has been committed —
    // seed records or other committed history in the sidebar don't unlock it for a draft.
    if (target === "commit" && !isCommitted) return;
    setStep(target);
  }

  function resetDemo() {
    setTranscript(SAMPLE); setRubric(DEFAULT_RUBRIC); setStatus("idle");
    setDraft(null); setError(""); setCrm([]); setAudit([]);
    setLibrary(SEED_LIBRARY); setActiveId(null);
    setStep("capture");
    notify("Demo reset", "info");
  }

  function newCapture() {
    setTranscript(""); setDraft(null); setActiveId(null); setStatus("idle"); setError(""); setStep("capture");
  }

  async function process() {
    setError(""); setStatus("processing"); setProcTick(0);
    const ticker = window.setInterval(() => setProcTick((t) => t + 1), 380);
    try {
      const r = await runProcessing(transcript, rubric);
      const draftId = "DRF-" + String(Date.now()).slice(-6);
      const draftRec = { ...r, id: draftId, committed: false, when: "Just now", band: r.lead_score.band };
      setLibrary((L) => [draftRec, ...L]);
      setDraft(draftRec); setActiveId(draftId);
      setStatus("review"); setStep("review");
    } catch (e) {
      setError(e.message || "Could not process the transcript."); setStatus("error");
    } finally {
      window.clearInterval(ticker);
    }
  }

  function patch(path, value) {
    setDraft((d) => {
      const n = structuredClone(d);
      let o = n; const keys = path.split(".");
      for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
      o[keys[keys.length - 1]] = value;
      return n;
    });
  }

  function approve() {
    if (!draft) return;
    // If already committed, this is an "Update in CRM" action — refresh the record but stay in place.
    if (isCommitted) {
      const zid = draft.id;
      setCrm((c) => c.map((r) => r.id === zid ? {
        ...r, contact: draft.contact, band: draft.lead_score.band,
        rationale: draft.lead_score.rationale, recap: draft.recap_email,
        nextSteps: draft.summary.next_steps, at: new Date(),
      } : r));
      setLibrary((L) => L.map((r) => r.id === zid ? { ...draft, id: zid, committed: true, when: "Updated just now" } : r));
      setAudit((a) => [{
        id: zid, model: "claude-sonnet-4-6", reviewer: "You (demo reviewer)",
        rubric: "2026-06", outcome: "updated", target: "Zoho sandbox", at: new Date(),
      }, ...a]);
      notify(`${zid} updated in Zoho sandbox`, "success");
      return;
    }
    // First commit — mint a Zoho activity ID and promote the draft into the committed library.
    const zid = "ZOHO-" + String(Date.now()).slice(-6);
    const committed = { ...draft, id: zid, committed: true, when: "Committed just now", band: draft.lead_score.band };
    const rec = {
      id: zid, contact: draft.contact, band: draft.lead_score.band,
      rationale: draft.lead_score.rationale, recap: draft.recap_email,
      nextSteps: draft.summary.next_steps, at: new Date(),
    };
    setCrm((c) => [rec, ...c]);
    setAudit((a) => [{
      id: zid, model: "claude-sonnet-4-6", reviewer: "You (demo reviewer)",
      rubric: "2026-06", outcome: "written", target: "Zoho sandbox", at: new Date(),
    }, ...a]);
    // Replace the old draft entry (by activeId) with the committed record.
    setLibrary((L) => {
      const filtered = L.filter((r) => r.id !== activeId);
      return [committed, ...filtered];
    });
    setDraft(committed); setActiveId(zid); setStatus("idle"); setStep("commit");
    notify(`${zid} written to Zoho sandbox`, "success");
  }

  function reject() {
    const rid = "REJ-" + String(Date.now()).slice(-6);
    setAudit((a) => [{
      id: rid, model: "claude-sonnet-4-6", reviewer: "You (demo reviewer)",
      rubric: "2026-06", outcome: "rejected", target: "—", at: new Date(),
    }, ...a]);
    // Remove the rejected draft from the library entirely.
    setLibrary((L) => L.filter((r) => r.id !== activeId));
    setDraft(null); setActiveId(null); setStatus("idle"); setStep("capture");
    notify(`Draft rejected · no CRM write · logged internally`, "reject");
  }

  const band = draft ? BAND[draft.lead_score.band] : null;
  const unresolved = draft ? [
    ...Object.entries(draft.contact).filter(([, f]) => f.confidence === "low" && !f.value).map(([k]) => `${k} unconfirmed`),
    ...(draft.summary.open_questions || []).map(() => "open question"),
  ] : [];

  // Panel visibility — user can collapse either side. Chat is only meaningful past Capture.
  const [sidebarOpen, setSidebarOpen] = useState(() =>
    typeof window === "undefined" ? true : window.innerWidth > 900
  );
  const [chatOpen, setChatOpen] = useState(true);
  const showChat = step !== "capture";
  const chatVisible = showChat && chatOpen;
  const chatContext = {
    company: (draft && draft.contact.company.value) || (crm[0] && crm[0].contact.company.value) || "Cascade Ember",
    signals: "distribution pain, price-transparency pain, and a listing/marketplace need",
  };

  return (
    <div>
      {/* Toast */}
      {toast && (
        <div role="status" style={{
          position: "fixed", top: 14, left: "50%", zIndex: 50,
          animation: "kx-toast-in 0.18s ease-out",
          background: toast.tone === "success" ? "var(--green-deep)" : toast.tone === "reject" ? "var(--rust)" : "var(--midnight)",
          color: "#fff", fontSize: 12.5, fontWeight: 600, padding: "9px 16px", borderRadius: 4,
          boxShadow: "0 4px 14px rgba(15,35,69,0.25)", display: "flex", alignItems: "center", gap: 8,
        }}>
          {toast.tone === "success" ? <CheckCircle2 size={14} /> : toast.tone === "reject" ? <XCircle size={14} /> : <History size={14} />}
          {toast.message}
        </div>
      )}

      {/* Header */}
      <div className="kx-header">
        <div className="kx-header-left">
          <img className="kx-header-logo" src="KX-Primary-logo.png" alt="Kaffea-X" />
          <img className="kx-header-logo-mini" src="favicon.png" alt="Kaffea-X" />
          <div className="kx-header-divider"></div>
          <span className="kx-header-app">Meeting Summary to CRM</span>
        </div>
        <div className="kx-header-right">
          <div className="kx-header-user">
            <div className="kx-header-name">Mohan Verma</div>
            <div className="kx-header-email">mohan.verma@kaffeax.com</div>
          </div>
          <div className="kx-header-avatar">MR</div>
        </div>
      </div>

      {/* App shell */}
      <div className={"kx-shell" + (sidebarOpen ? "" : " no-sidebar") + (chatVisible ? "" : " no-chat")}>
        {sidebarOpen && (
          <div
            className="kx-sidebar-backdrop"
            onClick={() => setSidebarOpen(false)}
            aria-hidden="true"
          />
        )}
        {sidebarOpen ? (
          <Sidebar
            library={library}
            activeId={activeId}
            onSelect={openFromLibrary}
            onNew={newCapture}
            onCollapse={() => setSidebarOpen(false)}
          />
        ) : (
          <aside className="kx-sidebar-rail">
            <button
              className="kx-side-peek"
              onClick={() => setSidebarOpen(true)}
              title="Show recent meetings"
              aria-label="Show recent meetings"
            >
              <PanelLeft size={16} />
              <span className="kx-side-peek-label">Recent meetings</span>
            </button>
          </aside>
        )}

        <main className="kx-main">
          <div className="kx-main-breadcrumb">
            <Stepper
              step={step}
              draftReady={!!draft}
              activeCommitted={isCommitted}
              goTo={goTo}
            />
          </div>

          <div className="kx-main-body">
          {status === "processing" && (
            <ProcessingModal procTick={procTick} />
          )}

          {step === "capture" && status !== "processing" && (
            <div className="kx-capture-shell">
              <div className="kx-capture-hero">
                <div className="kx-capture-hero-copy">
                  <Hero
                    eyebrow="New meeting"
                    title="Turn a call into a scored lead."
                    sub="Paste a meeting transcript. Agent extracts contacts, scores intent against your rubric — you review and approve before anything touches the CRM."
                  />
                </div>
                <button
                  className="kx-rubric-fab"
                  onClick={() => setRubricOpen(true)}
                  title="Open scoring rubric"
                  aria-label="Open scoring rubric"
                >
                  <SlidersHorizontal size={14} />
                  <span className="kx-rubric-fab-label">Scoring rubric</span>
                  <span className="kx-rubric-fab-dot" aria-hidden="true" />
                </button>
              </div>

              <div className="kx-capture-grid">
                {/* Transcript fills the whole viewport width — rubric now lives in the floating assistant */}
                <div className="kx-capture-col">
                  <div className="kx-card kx-transcript-card"
                    onDragOver={(e) => { e.preventDefault(); }}
                    onDrop={(e) => {
                      e.preventDefault();
                      const f = e.dataTransfer.files && e.dataTransfer.files[0];
                      if (!f) return;
                      const r = new FileReader();
                      r.onload = () => setTranscript(String(r.result || ""));
                      r.readAsText(f);
                    }}
                  >
                    <div className="kx-transcript-head">
                      <div className="kx-eyebrow-inline">Transcript</div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => fileInputRef.current && fileInputRef.current.click()} className="kx-btn kx-btn-ghost">
                          <UploadCloud size={13} /> Attach file
                        </button>
                        <button onClick={() => setTranscript(SAMPLE)} className="kx-btn kx-btn-ghost">
                          <FileText size={13} /> Load sample
                        </button>
                      </div>
                    </div>
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".txt,.md,.vtt,.srt"
                      style={{ display: "none" }}
                      onChange={handleFile}
                    />
                    <textarea
                      value={transcript}
                      onChange={(e) => setTranscript(e.target.value)}
                      spellCheck={false}
                      className="kx-transcript-textarea"
                      placeholder="Paste a meeting transcript, drop a .txt/.vtt file, or attach one…"
                    />
                    {status === "error" && (
                      <div style={{ marginTop: 12, display: "flex", alignItems: "flex-start", gap: 8,
                        background: "#FBEAE7", border: "1px solid #E7C9C2", borderRadius: 8, padding: 10 }}>
                        <AlertTriangle size={16} color="var(--rust)" />
                        <span style={{ fontSize: 12, color: "var(--rust)" }}>{error}</span>
                      </div>
                    )}
                    <div className="kx-transcript-foot">
                      <span style={{ fontSize: 12, color: "var(--muted)" }}>
                        {transcript.trim() ? transcript.trim().split(/\s+/).length : 0} words
                      </span>
                      <div className="kx-transcript-actions">
                        <button
                          onClick={() => setTranscript("")}
                          className="kx-btn kx-btn-ghost"
                          disabled={!transcript}
                          style={{ padding: "10px 18px", fontSize: 12, textTransform: "uppercase", letterSpacing: "0.04em", fontWeight: 600 }}
                        >
                          Clear
                        </button>
                        <button
                          onClick={process}
                          disabled={!transcript.trim() || status === "processing"}
                          className="kx-btn kx-btn-primary"
                        >
                          {status === "processing" ? <Loader2 size={16} className="kx-spin" /> : <Sparkles size={16} />}
                          Summarise
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Rubric now lives inside the floating-assistant modal below */}
              </div>

              {rubricOpen && (
                <div className="kx-rubric-overlay" onClick={() => setRubricOpen(false)}>
                  <div className="kx-rubric-modal" onClick={(e) => e.stopPropagation()} style={{ position: "relative" }}>
                    <button
                      className="kx-rubric-modal-close"
                      onClick={() => setRubricOpen(false)}
                      aria-label="Close scoring rubric"
                    >
                      <X size={16} />
                    </button>
                    <div className="kx-rubric-head">
                      <div className="kx-rubric-title-row">
                        <div>
                          <div className="kx-eyebrow-inline" style={{ marginBottom: 2 }}>Scoring rubric</div>
                        </div>
                      </div>
                    </div>

                    <div className="kx-rubric-body-2col">
                      <aside className="kx-rubric-body-left">
                        <div className="kx-rubric-body-left-title">Banding rule</div>
                        <div className="kx-band-pills" title="Banding rule">
                          <div className="kx-band-pill hot">
                            <span className="kx-band-pill-label">Hot</span>
                            <span className="kx-band-pill-rule">≥1 HOT signal AND a next step agreed</span>
                          </div>
                          <div className="kx-band-pill warm">
                            <span className="kx-band-pill-label">Warm</span>
                            <span className="kx-band-pill-rule">≥1 WARM signal with no cold-overriding signal</span>
                          </div>
                          <div className="kx-band-pill cold">
                            <span className="kx-band-pill-label">Cold</span>
                            <span className="kx-band-pill-rule">Nothing else fires</span>
                          </div>
                        </div>
                        <div className="kx-rubric-body-left-help">
                          <b>How scoring works.</b> Every signal you list on the right is scanned in the transcript. Weights (<b>HOT</b>, <b>WARM</b>, <b>COLD</b>) decide the band via the rule above. Changes are live — the next transcript uses the updated rubric with no deploy.
                        </div>
                      </aside>

                      <div className="kx-rubric-body-right">
                      <div className="kx-rubric-section-row">
                        <div>
                          <span className="kx-rubric-section-label">Signals</span>
                          <span className="kx-rubric-section-count"> · {rubric.signals.length} tracked</span>
                        </div>
                        {!addingSignal && (
                          <button
                            onClick={() => setAddingSignal(true)}
                            className="kx-btn-add-signal"
                          >
                            <Plus size={12} /> Add signal
                          </button>
                        )}
                      </div>
                      <div className="kx-signal-list">
                        {rubric.signals.map((sig, i) => (
                          <div key={sig.id || i} className={"kx-signal-card " + sig.weight}>
                            <input
                              value={sig.label}
                              onChange={(e) => setRubric((r) => { const s = structuredClone(r); s.signals[i].label = e.target.value; return s; })}
                              className="kx-signal-card-input"
                              placeholder="Signal description"
                            />
                            <div className="kx-signal-card-foot">
                              <div className="kx-weight-seg" role="radiogroup" aria-label="Signal weight">
                                {["hot", "warm", "cold"].map((w) => (
                                  <button
                                    key={w}
                                    type="button"
                                    className={"kx-weight-seg-btn " + w + (sig.weight === w ? " active" : "")}
                                    onClick={() => setRubric((r) => { const s = structuredClone(r); s.signals[i].weight = w; return s; })}
                                    aria-pressed={sig.weight === w}
                                  >
                                    {w.toUpperCase()}
                                  </button>
                                ))}
                              </div>
                              <button
                                onClick={() => setRubric((r) => { const s = structuredClone(r); s.signals.splice(i, 1); return s; })}
                                className="kx-signal-card-remove"
                                aria-label="Remove signal"
                                title="Remove signal"
                              >
                                <Trash2 size={14} />
                              </button>
                            </div>
                          </div>
                        ))}

                        {addingSignal && (
                          <div className={"kx-signal-card compose " + newSignalWeight}>
                            <input
                              autoFocus
                              value={newSignalLabel}
                              onChange={(e) => setNewSignalLabel(e.target.value)}
                              onKeyDown={(e) => {
                                if (e.key === "Enter") saveNewSignal();
                                if (e.key === "Escape") cancelNewSignal();
                              }}
                              className="kx-signal-card-input"
                              placeholder="Describe the signal — e.g., 'Mentioned a competitor by name'"
                            />
                            <div className="kx-signal-card-foot">
                              <div className="kx-weight-seg" role="radiogroup" aria-label="Signal weight">
                                {["hot", "warm", "cold"].map((w) => (
                                  <button
                                    key={w}
                                    type="button"
                                    className={"kx-weight-seg-btn " + w + (newSignalWeight === w ? " active" : "")}
                                    onClick={() => setNewSignalWeight(w)}
                                  >
                                    {w.toUpperCase()}
                                  </button>
                                ))}
                              </div>
                              <div className="kx-compose-actions">
                                <button className="kx-btn-mini ghost" onClick={cancelNewSignal}>Cancel</button>
                                <button
                                  className="kx-btn-mini primary"
                                  onClick={saveNewSignal}
                                  disabled={!newSignalLabel.trim()}
                                >
                                  Add
                                </button>
                              </div>
                            </div>
                          </div>
                        )}
                      </div>

                      </div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {step === "review" && draft && (
            <ReviewScreen
              draft={draft}
              patch={patch}
              band={band}
              committed={isCommitted}
              onApprove={approve}
              onReject={reject}
            />
          )}

          {step === "commit" && (
            <div className="kx-commit-wrap">
              <Hero
                eyebrow="Written to CRM"
                title="This meeting is now in Zoho"
                sub="The activity record below was just written to the Zoho CRM"
              />

              <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 16 }}>
                <button onClick={newCapture} className="kx-btn kx-btn-ghost">
                  <FileText size={13} /> Capture another meeting
                </button>
              </div>

              {crm.filter((r) => r.id === activeId).length === 0 && <Empty text="Approve a draft on the Review step to see the CRM activity here." />}
              {crm.filter((r) => r.id === activeId).map((r) => {
                const rec = library.find((l) => l.id === r.id);
                return (
                  <div key={r.id} className="kx-commit-card">
                    <div className="kx-commit-card-head">
                      <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                        <h2 className="kx-commit-card-title">
                          {r.contact.company.value || "Unnamed company"}
                        </h2>
                        <span className={"kx-badge " + BAND[r.band].cls}>{BAND[r.band].label}</span>
                        <span className="kx-review-status">
                          <CheckCircle2 size={12} /> Written to Zoho
                        </span>
                      </div>
                      {rec && (
                        <button
                          className="kx-btn kx-btn-ghost"
                          onClick={() => openFromLibrary(rec)}
                          title="Open this record in Review"
                        >
                          <FileText size={13} /> Open in Review
                        </button>
                      )}
                    </div>
                    <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 12 }}>
                      {r.contact.name.value || "—"} · {r.contact.title.value || "—"}
                      {r.contact.email.value && ` · ${r.contact.email.value}`}
                    </div>
                    <div style={{
                      borderLeft: "3px solid var(--mustard)",
                      paddingLeft: 12,
                      fontStyle: "italic",
                      color: "var(--midnight)",
                      fontSize: 13, lineHeight: 1.55,
                      margin: "12px 0",
                    }}>
                      {r.rationale}
                    </div>
                    <div className="kx-commit-card-foot">
                      <span>Written {r.at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
                      <span className="kx-commit-id" title="Zoho activity record ID">
                        Zoho activity · <b>{r.id}</b>
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          </div>
        </main>

        {chatVisible && <ChatPanel context={chatContext} onClose={() => setChatOpen(false)} />}
      </div>

      {/* Floating chat FAB — appears when chat is closed on screens that support it */}
      {showChat && !chatOpen && (
        <button
          className="kx-chat-fab"
          onClick={() => setChatOpen(true)}
          title="Ask about this lead"
          aria-label="Open chat"
        >
          <MessageSquare size={22} />
          <span className="kx-chat-fab-dot" aria-hidden="true" />
          <span className="kx-chat-fab-label">Ask about this lead</span>
        </button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<KaffeaXPOC />);

</script>
</body>
</html>
