<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaffea-X POC — Meeting Summary to CRM</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --midnight:#0F2345; --dark-blue:#223970; --bright-blue:#1F519F; --light-blue:#4D78BC;
    --green:#41BB93; --green-deep:#35A07D; --mustard:#A4812D; --cream:#E7E3D0; --tan:#C2B27F;
    --dark-brown:#343123; --rust:#A13323; --dark-teal:#29494D; --pale-blue:#9DB9D4;
    --white:#fff; --text:#1E1E1E; --muted:#6B6B67; --border:#E4DDCE; --border-strong:#C4BBA6; --border-warm:#E4DDCE;
    --page-bg:#F5F3EE; --card-bg:#fff; --sidebar-bg:#223970; --sidebar-text:#D4DAE8;
    --chat-bg-start:#F5F3EE; --chat-bg-end:#EBE7DA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: var(--page-bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
  }
  #root { height: 100vh; overflow: hidden; }
  input, textarea, button, select { font-family: inherit; }
  h1, h2, h3, h4 { margin: 0; }

  /* ---- Header ---- */
  .kx-header {
    background: #fff; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    border-bottom: 1px solid var(--border-strong);
    box-shadow: 0 1px 2px rgba(15,35,69,0.04);
    gap: 12px;
  }
  .kx-header-left {
    display: flex; align-items: center; gap: 14px;
    min-width: 0; flex: 1 1 auto;
  }
  .kx-header-logo { height: 34px; display: block; opacity: 1; flex-shrink: 0; }
  .kx-header-logo-mini {
    display: none;
    height: 32px; width: 32px;
    border-radius: 8px;
    flex-shrink: 0;
    object-fit: cover;
  }
  .kx-header-divider { width: 1px; height: 26px; background: var(--border-strong); flex-shrink: 0; }
  .kx-header-app {
    font-family: 'Figtree', sans-serif;
    font-size: 13px; font-weight: 500;
    color: var(--midnight); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .kx-header-right {
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .kx-header-user { text-align: right; min-width: 0; }
  .kx-header-name {
    font-size: 13px; font-weight: 700; color: var(--midnight); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .kx-header-email {
    font-size: 11px; color: var(--muted); line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .kx-header-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--green); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Figtree', sans-serif;
    font-size: 13px; font-weight: 800;
    flex-shrink: 0;
  }
  @media (max-width: 900px) {
    .kx-header { padding: 0 16px; }
    .kx-header-logo { display: none; }
    .kx-header-logo-mini { display: block; }
    .kx-header-divider { height: 22px; }
    .kx-header-app { font-size: 12.5px; }
    .kx-header-name, .kx-header-email { max-width: 140px; }
  }
  @media (max-width: 560px) {
    .kx-header { padding: 0 12px; gap: 8px; }
    .kx-header-left { gap: 8px; }
    .kx-header-app { font-size: 11.5px; }
    .kx-header-email { display: none; }
    .kx-header-user { display: none; }
    .kx-header-avatar { width: 32px; height: 32px; font-size: 12px; }
  }
  @media (max-width: 400px) {
    .kx-header-divider { display: none; }
    .kx-header-app { font-size: 11px; }
  }

  /* ---- Breadcrumb (replaces the old numbered stepper) ---- */
  .kx-main-breadcrumb {
    padding: 12px 40px 4px;
    background: transparent;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: flex-start;
    gap: 16px;
    z-index: 6;
  }
  .kx-breadcrumb {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Figtree', sans-serif;
    font-size: 14.5px;
    color: var(--muted);
  }
  .kx-crumb {
    background: none; border: none; padding: 2px 0;
    font-family: inherit; font-size: inherit;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s;
    letter-spacing: 0.01em;
  }
  .kx-crumb:hover:not(:disabled):not(.active) { color: var(--midnight); }
  .kx-crumb.active {
    color: var(--midnight);
    font-weight: 700;
    cursor: default;
  }
  .kx-crumb:disabled { cursor: not-allowed; opacity: 0.5; }
  .kx-crumb-sep {
    color: var(--border-strong);
    font-size: 11px;
    user-select: none;
  }

  /* ---- Sticky action footer (Review) ---- */
  .kx-main-actions {
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid var(--border-strong);
    padding: 12px 40px;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 10px;
    box-shadow: 0 -4px 12px rgba(15,35,69,0.04);
    z-index: 6;
  }

  /* ---- App shell ---- */
  .kx-shell {
    display: grid;
    grid-template-columns: 260px minmax(0,1fr) 340px;
    height: calc(100vh - 56px);
  }
  .kx-shell.no-chat { grid-template-columns: 260px minmax(0,1fr); }
  /* When the sidebar is collapsed, keep a narrow rail column in its place. */
  .kx-shell.no-sidebar { grid-template-columns: 56px minmax(0,1fr) 340px; }
  .kx-shell.no-sidebar.no-chat { grid-template-columns: 56px minmax(0,1fr); }
  .kx-shell > .kx-sidebar { min-height: 0; overflow-y: auto; }
  .kx-shell > .kx-sidebar-rail { min-height: 0; overflow: hidden; }
  .kx-shell > .kx-main { min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
  .kx-shell > .kx-chat { min-height: 0; overflow: hidden; }
  @media (max-width: 1100px) {
    .kx-shell { grid-template-columns: 220px minmax(0,1fr) 300px; }
    .kx-shell.no-chat { grid-template-columns: 220px minmax(0,1fr); }
    .kx-shell.no-sidebar { grid-template-columns: 56px minmax(0,1fr) 300px; }
    .kx-shell.no-sidebar.no-chat { grid-template-columns: 56px minmax(0,1fr); }
  }
  @media (max-width: 900px) {
    /* Sidebar open: rail is not rendered — main takes the full width, drawer floats over. */
    .kx-shell,
    .kx-shell.no-chat {
      grid-template-columns: minmax(0,1fr);
    }
    /* Sidebar closed: the 56px navy rail column stays on the extreme left, same as desktop. */
    .kx-shell.no-sidebar,
    .kx-shell.no-sidebar.no-chat {
      grid-template-columns: 56px minmax(0,1fr);
    }
    /* Chat becomes a full-screen takeover below the header on small screens.
       Rendered when chatVisible is true — a big X in its header closes it.
       Height is derived from top/bottom (not the desktop height:100%) so the
       input bar stays inside the viewport instead of being pushed past the
       fold. Higher z-index than the sidebar drawer so the newer surface wins. */
    .kx-shell > .kx-chat {
      position: fixed;
      top: 56px; left: 0; right: 0; bottom: 0;
      height: auto;
      z-index: 50;
      border-left: none;
      padding: 16px 16px 14px;
      animation: kx-chat-slide-up 0.22s ease-out;
    }
    /* Trim the header block so more room is left for messages + input. */
    .kx-shell > .kx-chat .kx-chat-title { font-size: 18px; margin-bottom: 4px; }
    .kx-shell > .kx-chat .kx-chat-eyebrow { margin-bottom: 4px; }
    /* Input bar stays pinned at the bottom, comfortably tappable. */
    .kx-shell > .kx-chat .kx-chat-input-bar {
      margin-top: 10px;
      padding-top: 10px;
      flex-shrink: 0;
    }
    .kx-shell > .kx-chat .kx-chat-input {
      padding: 12px 14px;
      font-size: 14px;
      min-width: 0;
    }
    .kx-shell > .kx-chat .kx-chat-send { width: 44px; height: 44px; flex-shrink: 0; }
    /* Let messages, bubbles, and chips shrink inside the fixed overlay so
       nothing bleeds past the right edge. */
    .kx-shell > .kx-chat .kx-chat-messages { min-width: 0; }
    .kx-shell > .kx-chat .kx-chat-bubble-ai { min-width: 0; }
    .kx-shell > .kx-chat .kx-chat-bubble-user { max-width: 82%; }
    .kx-shell > .kx-chat .kx-chat-chips { margin-left: 42px; margin-right: 0; }
    .kx-shell > .kx-sidebar {
      position: fixed;
      top: 56px; left: 0; bottom: 0;
      width: min(300px, 85vw);
      z-index: 45;
      box-shadow: 0 12px 32px rgba(15,35,69,0.28);
      border-right: 1px solid rgba(255,255,255,0.06);
    }
    .kx-sidebar-backdrop {
      display: block;
      position: fixed; inset: 56px 0 0 0;
      background: rgba(15,35,69,0.4);
      z-index: 44;
      animation: kx-fade-in 0.15s ease-out;
    }
  }
  .kx-sidebar-backdrop { display: none; }

  /* ---- Collapsed sidebar rail (56px column, navy, hosts the expand button) ---- */
  .kx-sidebar-rail {
    background: var(--sidebar-bg);
    border-right: 1px solid rgba(255,255,255,0.06);
    padding: 18px 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  /* ---- Sidebar collapse control (chevron in header) ---- */
  .kx-side-collapse {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    width: 26px; height: 26px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    padding: 0;
  }
  .kx-side-collapse:hover {
    background: rgba(255,255,255,0.06);
    color: #fff;
    border-color: rgba(255,255,255,0.24);
  }

  /* ---- Expand-sidebar button, hosted inside the collapsed navy rail column.
     Sits at the top of the rail — clicking restores the full 260px sidebar. ---- */
  .kx-side-peek {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: rgba(255,255,255,0.06);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.10);
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s, border-color 0.15s;
    padding: 0;
    flex-shrink: 0;
    position: relative;
  }
  .kx-side-peek:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.22);
  }
  .kx-side-peek-label {
    position: absolute; left: 46px; top: 50%;
    transform: translateY(-50%);
    background: var(--sidebar-bg); color: #fff;
    font-family: 'Figtree', sans-serif;
    font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 6px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
    box-shadow: 0 2px 8px rgba(15,35,69,0.25);
    z-index: 20;
  }
  .kx-side-peek:hover .kx-side-peek-label { opacity: 1; }
  .kx-side-peek-label::before {
    content: "";
    position: absolute; left: -4px; top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: var(--sidebar-bg);
  }

  /* ---- Chat panel header + close button ---- */
  .kx-chat-header-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px;
  }
  .kx-chat-close {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--muted);
    width: 26px; height: 26px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    padding: 0;
  }
  .kx-chat-close:hover {
    background: var(--page-bg);
    color: var(--midnight);
    border-color: var(--midnight);
  }
  /* Bigger, more tappable close on the mobile takeover. */
  @media (max-width: 900px) {
    .kx-chat-close {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: #fff;
      border-color: var(--border);
      color: var(--midnight);
    }
  }

  /* ---- Floating "open chat" FAB, visible when chat is collapsed ---- */
  .kx-chat-fab {
    position: fixed; right: 24px; bottom: 24px;
    z-index: 40;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--midnight);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(15,35,69,0.35);
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .kx-chat-fab:hover {
    transform: translateY(-2px);
    background: #182b4a;
    box-shadow: 0 8px 22px rgba(15,35,69,0.42);
  }
  .kx-chat-fab-dot {
    position: absolute; top: 10px; right: 12px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--mustard);
    border: 2px solid var(--midnight);
    box-sizing: content-box;
  }
  .kx-chat-fab-label {
    position: absolute; right: 68px; top: 50%;
    transform: translateY(-50%);
    background: var(--midnight); color: #fff;
    font-family: 'Figtree', sans-serif;
    font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 6px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
    box-shadow: 0 2px 8px rgba(15,35,69,0.25);
  }
  .kx-chat-fab:hover .kx-chat-fab-label { opacity: 1; }
  .kx-chat-fab-label::after {
    content: "";
    position: absolute; right: -4px; top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 8px; height: 8px;
    background: var(--midnight);
  }

  /* ---- Sidebar ---- */
  .kx-sidebar {
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    padding: 22px 0 24px;
    overflow-y: auto;
    border-right: 1px solid rgba(255,255,255,0.06);
  }
  .kx-side-title {
    font-size: 16px; font-weight: 800; color: #fff;
  }
  .kx-side-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px 12px;
  }
  .kx-side-new {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(65,187,147,0.14);
    border: 1px solid rgba(65,187,147,0.35);
    color: #E8F6F0;
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 700;
    padding: 4px 8px; border-radius: 6px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .kx-side-new:hover { background: rgba(65,187,147,0.24); border-color: rgba(65,187,147,0.55); }
  .kx-side-group-wrap { margin-bottom: 6px; }
  .kx-side-group-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px 4px;
  }
  .kx-side-group-count {
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    color: #6B7A99;
    background: rgba(255,255,255,0.06);
    padding: 1px 6px; border-radius: 10px;
  }
  .kx-side-empty {
    font-size: 11px; color: #6B7A99;
    padding: 4px 18px 8px; font-style: italic;
  }
  .kx-side-status {
    font-size: 8.5px; font-weight: 800; letter-spacing: 0.06em;
    padding: 2px 6px; border-radius: 3px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .kx-side-status.saved  { background: rgba(65,187,147,0.18); color: #A6E6CA; border: 1px solid rgba(65,187,147,0.35); }
  .kx-side-status.draft  { background: rgba(164,129,45,0.18); color: #E6C778; border: 1px solid rgba(164,129,45,0.4); }
  .kx-side-search-wrap {
    position: relative; margin: 0 12px 14px;
  }
  .kx-side-search {
    width: 100%; padding: 8px 12px 8px 32px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.06);
    color: #E8EAF0; font-size: 12px; outline: none;
  }
  .kx-side-search::placeholder { color: #8090B0; }
  .kx-side-search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: #8090B0; pointer-events: none;
  }
  .kx-side-group {
    font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: #8090B0;
    padding: 10px 18px 4px;
  }
  .kx-side-item {
    padding: 9px 12px; margin: 2px 8px;
    border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: background 0.15s, border-color 0.15s;
    border: 1px solid transparent;
    background: transparent;
    color: inherit; text-align: left;
    font-family: inherit;
    width: calc(100% - 16px);
  }
  .kx-side-item:hover { background: rgba(255,255,255,0.06); }
  .kx-side-item.active {
    background: rgba(65,187,147,0.15);
    border-color: rgba(65,187,147,0.3);
  }
  .kx-side-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 5px; flex-shrink: 0; background: var(--muted);
  }
  .kx-side-item.active .kx-side-dot {
    box-shadow: 0 0 8px currentColor;
  }
  .kx-side-item-title {
    font-size: 13px; font-weight: 700; color: #E8EAF0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kx-side-item-meta { font-size: 11px; color: #8090B0; margin-top: 2px; }

  /* ---- Main content ---- */
  .kx-main-body {
    flex: 1; min-height: 0; min-width: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 12px 40px 40px;
  }
  .kx-eyebrow {
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 800;
    color: var(--mustard);
    text-transform: uppercase; letter-spacing: 0.14em;
    margin-bottom: 10px;
  }
  .kx-h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 32px; font-weight: 900;
    color: var(--midnight);
    letter-spacing: -0.03em; line-height: 1.1;
  }
  .kx-h1.sm { font-size: 28px; }
  .kx-accent-bar {
    width: 112px; height: 10px; border-radius: 2px;
    background: var(--midnight);
    margin: 12px 0 16px;
  }
  .kx-sub {
    font-size: 14px; color: var(--muted);
    line-height: 1.55; max-width: none;
    margin-bottom: 24px;
  }

  /* ---- Cards ---- */
  .kx-card {
    background: var(--card-bg);
    border-radius: 12px;
    border: 1px solid var(--border-warm);
    padding: 16px;
    box-shadow: 0 1px 3px rgba(15,35,69,0.05), 0 4px 16px rgba(15,35,69,0.03);
  }
  .kx-card.navy {
    background: var(--midnight); color: #fff;
    border: none;
  }
  .kx-section-title {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 800;
    color: var(--mustard);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .kx-section-title.on-navy { color: var(--mustard); }

  /* ---- Buttons ---- */
  .kx-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: 'Figtree', sans-serif;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px;
    transition: filter 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .kx-btn-primary {
    background: var(--green); color: #fff; border: none;
    padding: 10px 20px;
    font-size: 12.5px;
    text-transform: uppercase; letter-spacing: 0.04em;
    box-shadow: 0 1px 2px rgba(15,35,69,0.08);
  }
  .kx-btn-primary:hover { filter: brightness(0.92); box-shadow: 0 2px 6px rgba(65,187,147,0.32); }
  .kx-btn-primary:disabled { opacity: 0.55; cursor: not-allowed; filter: none; box-shadow: none; }
  .kx-btn-approve {
    background: var(--green-deep); color: #fff; border: none;
    padding: 10px 20px;
    font-size: 12.5px;
    text-transform: uppercase; letter-spacing: 0.04em;
    border-radius: 8px;
    box-shadow: 0 1px 2px rgba(15,35,69,0.08);
  }
  .kx-btn-approve:hover { filter: brightness(0.92); }
  .kx-btn-approve:disabled { opacity: 0.5; cursor: not-allowed; filter: none; box-shadow: none; }
  .kx-btn-approve:disabled:hover { filter: none; }
  .kx-btn-reject {
    background: #fff; color: var(--rust);
    border: 2px solid var(--rust);
    padding: 8px 18px;
    font-size: 12.5px;
    text-transform: uppercase; letter-spacing: 0.04em;
    border-radius: 8px;
  }
  .kx-btn-reject:hover { background: #FBEAE7; }
  .kx-btn-send {
    background: #fff; color: var(--midnight);
    border: 1px solid var(--midnight);
    padding: 10px 18px;
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    border-radius: 8px;
  }
  .kx-btn-send:hover { background: var(--page-bg); }
  /* Compact size modifier — used in tight clusters (top-right of Review) so a long title never collides */
  .kx-btn.kx-btn-sm {
    padding: 6px 10px;
    font-size: 10.5px;
    gap: 5px;
    letter-spacing: 0.02em;
    border-radius: 6px;
    white-space: nowrap;
  }
  .kx-btn.kx-btn-sm.kx-btn-reject { padding: 4px 10px; }
  .kx-btn-ghost {
    background: #fff; color: var(--midnight);
    border: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 12px; font-weight: 500;
    border-radius: 8px;
  }
  .kx-btn-ghost:hover { background: #F5F3EE; border-color: var(--border-strong); }
  .kx-btn-primary-wide { width: 100%; justify-content: center; }

  /* ---- Inputs ---- */
  .kx-input {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--border-warm);
    border-radius: 6px; background: #fff;
    font-size: 12px; color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  .kx-input:focus { border-color: var(--green); }
  .kx-input.warn { border-color: var(--rust); background: #FDF3F1; }
  .kx-textarea {
    width: 100%; padding: 12px;
    border: 1px solid var(--border-warm);
    border-radius: 8px; background: #fff;
    font-family: 'Figtree', sans-serif;
    font-size: 12px; line-height: 1.55; color: var(--text);
    outline: none; resize: vertical;
  }
  .kx-textarea:focus { border-color: var(--green); }
  .kx-textarea.mono {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 11.5px; line-height: 1.5;
  }

  /* ---- Badges ---- */
  .kx-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 12px; border-radius: 20px;
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .kx-badge.hot { background: var(--green); color: #fff; }
  .kx-badge.warm { background: var(--mustard); color: #fff; }
  .kx-badge.cold { background: var(--dark-teal); color: var(--cream); }

  /* ---- Signal chips ---- */
  .kx-chip {
    display: inline-flex; align-items: center;
    background: #F0EDE5;
    border: 1px solid var(--tan);
    color: var(--midnight);
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
  }

  /* ---- Chat panel ---- */
  .kx-chat {
    background: linear-gradient(180deg, var(--chat-bg-start) 0%, var(--chat-bg-end) 100%);
    border-left: 1px solid var(--border);
    padding: 20px 18px;
    display: flex; flex-direction: column;
    overflow: hidden;
    height: 100%;
  }
  .kx-chat-eyebrow {
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 800;
    color: var(--mustard);
    text-transform: uppercase; letter-spacing: 0.14em;
    margin-bottom: 6px;
  }
  .kx-chat-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px; font-weight: 700;
    color: var(--midnight);
    margin-bottom: 6px;
  }
  .kx-chat-messages {
    flex: 1; display: flex; flex-direction: column; overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding-right: 2px;
    scroll-behavior: smooth;
  }
  .kx-chat-messages::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .kx-chat-row-ai {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 14px;
  }
  .kx-chat-row-user {
    display: flex; justify-content: flex-end;
    margin-bottom: 14px;
  }
  .kx-chat-bubble-ai {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 2px 12px 12px 12px;
    padding: 12px 14px;
    font-size: 13px; line-height: 1.55; color: var(--text);
    flex: 1; min-width: 0;
  }
  .kx-chat-bubble-user {
    background: var(--midnight); color: #fff;
    border-radius: 12px 2px 12px 12px;
    padding: 10px 14px;
    font-size: 13px; line-height: 1.55;
    max-width: 85%;
  }
  .kx-chat-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    overflow: hidden; flex-shrink: 0;
    background: #fff;
  }
  .kx-chat-avatar img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .kx-chat-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin: 2px 0 14px 42px; /* aligned with the AI bubble (32 avatar + 10 gap) */
  }
  .kx-chat-chips-eyebrow {
    font-family: 'Figtree', sans-serif;
    font-size: 9.5px; font-weight: 800; letter-spacing: 0.12em;
    color: var(--muted); text-transform: uppercase;
    margin: 0 0 6px 42px;
  }
  .kx-chat-chip {
    background: rgba(255,255,255,0.72);
    border: 1px solid var(--tan);
    color: var(--midnight);
    font-family: 'Figtree', sans-serif;
    font-size: 11.5px; font-weight: 600;
    padding: 6px 12px; border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .kx-chat-chip:hover {
    border-color: var(--green);
    background: #E8F6F0;
    color: var(--green-deep);
  }
  .kx-chat-input-bar {
    margin-top: 14px; padding-top: 12px;
    display: flex; gap: 8px;
    border-top: 1px solid var(--border-warm);
  }
  .kx-chat-input {
    flex: 1; padding: 10px 12px;
    border: 1px solid var(--border-warm);
    border-radius: 4px; background: #fff;
    font-size: 12.5px; outline: none;
  }
  .kx-chat-input:focus { border-color: var(--green); }
  .kx-chat-send {
    width: 38px; height: 38px; border-radius: 2px;
    background: var(--midnight); border: none;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .kx-chat-send:hover { background: #1A3562; }

  /* ---- Misc ---- */
  .kx-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .kx-2col { grid-template-columns: 1fr; } }
  .kx-divider { border-top: 1px solid var(--border-warm); margin: 12px 0; }
  .kx-footnote {
    font-size: 10.5px; color: var(--muted);
    text-align: center; margin: 20px 0 8px;
  }
  /* ---- Capture screen ---- */
  .kx-capture-shell {
    display: flex; flex-direction: column;
    height: 100%;
    gap: 16px;
  }
  .kx-capture-hero-copy > div { margin-bottom: 0 !important; }
  .kx-capture-hero .kx-h1 { font-size: 26px; }
  .kx-capture-hero .kx-accent-bar { margin: 10px 0 10px; }
  .kx-capture-hero .kx-sub { margin-bottom: 0; font-size: 13px; }
  .kx-capture-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1; min-height: 0;
    width: 100%;
  }
  .kx-capture-col {
    display: flex; flex-direction: column;
    min-height: 0;
    min-width: 0;
    flex: 1;
  }

  /* ---- Rubric assistant (top of capture, opposite the hero heading) ---- */
  .kx-capture-hero {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; flex-wrap: nowrap;
  }
  .kx-capture-hero-copy { min-width: 0; flex: 1 1 auto; }
  .kx-rubric-fab {
    flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--midnight);
    color: #fff;
    border: none; border-radius: 999px;
    font-family: 'Figtree', sans-serif;
    font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(15,35,69,0.22), 0 0 0 2px rgba(65,187,147,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 4px;
    white-space: nowrap;
  }
  .kx-rubric-fab:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 28px rgba(15,35,69,0.32), 0 0 0 2px var(--green);
  }
  .kx-rubric-fab .kx-rubric-fab-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
  }
  .kx-rubric-fab-label { display: inline; }
  @media (max-width: 720px) {
    .kx-rubric-fab { padding: 9px 12px; gap: 6px; letter-spacing: 0.04em; }
    .kx-rubric-fab-label { display: none; }
  }

  /* ---- Responsive capture-screen tightening ---- */
  @media (max-width: 900px) {
    .kx-main-body { padding: 10px 20px 28px; }
    .kx-main-breadcrumb { padding: 12px 20px 4px; }
    .kx-main-actions { padding: 12px 20px; }
    .kx-capture-hero .kx-h1 { font-size: 24px; }
    .kx-capture-hero .kx-accent-bar { width: 96px; height: 8px; }
    .kx-transcript-card { padding: 16px 16px; }
  }
  @media (max-width: 560px) {
    .kx-main-body { padding: 8px 14px 24px; }
    .kx-main-breadcrumb { padding: 10px 14px 4px; }
    .kx-main-actions {
      padding: 10px 14px;
      flex-wrap: wrap;
      justify-content: stretch;
    }
    .kx-capture-hero { gap: 12px; }
    .kx-capture-hero .kx-h1 { font-size: 22px; }
    .kx-capture-hero .kx-accent-bar { width: 72px; height: 6px; margin: 8px 0; }
    .kx-capture-hero .kx-sub { font-size: 12.5px; }
    .kx-transcript-card { padding: 14px 14px; }
    .kx-transcript-head, .kx-transcript-foot {
      gap: 8px;
    }
    .kx-transcript-textarea { padding: 12px; font-size: 12px; }
  }
  .kx-rubric-overlay {
    position: fixed; inset: 0;
    background: rgba(15,35,69,0.42);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 55;
    display: flex; align-items: center; justify-content: center;
    padding: 32px;
  }
  .kx-rubric-modal {
    width: 100%;
    max-width: 1080px;
    height: auto;
    max-height: calc(100vh - 64px);
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(15,35,69,0.35);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .kx-rubric-body-2col {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: 0;
    overflow: hidden;
  }
  .kx-rubric-body-left {
    background: linear-gradient(180deg, #FDFBF5 0%, #FBF9F2 100%);
    border-right: 1px solid var(--border-warm);
    padding: 20px 22px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .kx-rubric-body-left-help {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--border-warm);
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--muted);
  }
  .kx-rubric-body-left-help b {
    color: var(--midnight);
    font-weight: 700;
  }
  .kx-rubric-body-left .kx-band-pills {
    display: flex; flex-direction: column;
    gap: 10px;
    padding: 0;
    background: transparent;
    border-bottom: none;
  }
  .kx-rubric-body-left .kx-band-pill {
    padding: 12px 14px;
  }
  .kx-rubric-body-left .kx-band-pill-label {
    font-size: 11px;
  }
  .kx-rubric-body-left .kx-band-pill-rule {
    font-size: 12px;
  }
  .kx-rubric-body-right {
    padding: 20px 24px 22px;
    overflow-y: auto;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .kx-rubric-body-right .kx-rubric-section-row {
    margin-bottom: 10px;
  }
  .kx-rubric-body-right .kx-signal-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 8px;
    grid-auto-flow: row dense;
  }
  .kx-rubric-body-left-title {
    font-family: 'Figtree', sans-serif;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
  }
  @media (max-width: 900px) {
    .kx-rubric-body-2col { grid-template-columns: 1fr; }
    .kx-rubric-body-left { border-right: none; border-bottom: 1px solid var(--border-warm); }
    .kx-rubric-body-right .kx-signal-list { grid-template-columns: 1fr; }
  }
  .kx-rubric-modal-close {
    position: absolute;
    top: 14px; right: 14px;
    background: rgba(15,35,69,0.06);
    border: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--midnight);
    transition: background 0.15s;
  }
  .kx-rubric-modal-close:hover { background: rgba(15,35,69,0.12); }
  .kx-transcript-card {
    padding: 18px 20px;
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
  }
  .kx-transcript-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; gap: 12px; flex-wrap: wrap;
    flex-shrink: 0;
  }
  .kx-transcript-textarea {
    width: 100%;
    min-width: 0;
    flex: 1;
    min-height: 180px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    background: #FAFAF6;
    font-family: 'Consolas', 'SF Mono', 'Courier New', monospace;
    font-size: 12.5px; line-height: 1.6; color: var(--text);
    outline: none; resize: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .kx-transcript-textarea:focus { border-color: var(--green); background: #fff; }
  .kx-transcript-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px;
    gap: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .kx-transcript-actions {
    display: inline-flex; align-items: center; gap: 10px;
  }

  /* ---- Rubric card (modernized) ---- */
  .kx-rubric-card {
    padding: 0;
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
    overflow: hidden;
  }
  .kx-rubric-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border-warm);
    flex-shrink: 0;
    background: linear-gradient(180deg, #FDFBF5 0%, #FFFFFF 100%);
  }
  .kx-rubric-title-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px;
  }
  .kx-rubric-note {
    font-size: 11px; color: var(--muted);
    margin-top: 4px; line-height: 1.45;
  }
  .kx-rubric-note b.client { color: var(--green-deep); }
  .kx-rubric-note b.proposed { color: var(--mustard); }
  .kx-band-pills {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 12px 18px;
    background: #FBF9F2;
    border-bottom: 1px solid var(--border-warm);
    flex-shrink: 0;
  }
  .kx-band-pill {
    display: flex; flex-direction: column;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    position: relative; overflow: hidden;
    min-width: 0;
  }
  .kx-band-pill::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .kx-band-pill.hot::before { background: var(--green-deep); }
  .kx-band-pill.warm::before { background: var(--mustard); }
  .kx-band-pill.cold::before { background: var(--dark-teal); }
  .kx-band-pill-label {
    font-family: 'Figtree', sans-serif;
    font-size: 9.5px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 2px;
  }
  .kx-band-pill.hot .kx-band-pill-label { color: var(--green-deep); }
  .kx-band-pill.warm .kx-band-pill-label { color: var(--mustard); }
  .kx-band-pill.cold .kx-band-pill-label { color: var(--dark-teal); }
  .kx-band-pill-rule {
    font-size: 10.5px; line-height: 1.35; color: var(--muted);
  }
  .kx-rubric-body {
    padding: 12px 18px 14px;
    overflow-y: auto;
    flex: 1; min-height: 0;
  }
  .kx-rubric-section-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
    gap: 12px;
  }
  .kx-rubric-section-label {
    font-size: 10px; font-weight: 800;
    color: var(--midnight);
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .kx-rubric-section-count {
    font-size: 10px; color: var(--muted); font-weight: 600;
  }
  .kx-btn-add-signal {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    background: var(--green);
    color: #fff;
    border: none; border-radius: 6px;
    font-family: 'Figtree', sans-serif;
    font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.04em; text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(65,187,147,0.25);
    transition: filter 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .kx-btn-add-signal:hover {
    filter: brightness(0.94);
    box-shadow: 0 2px 6px rgba(65,187,147,0.35);
  }
  .kx-signal-list {
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .kx-signal-card {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px 8px;
    transition: box-shadow 0.15s, border-color 0.15s;
    position: relative;
  }
  .kx-signal-card:hover {
    box-shadow: 0 2px 6px rgba(15,35,69,0.06);
  }
  .kx-signal-card.hot  { border-left-color: var(--green-deep); }
  .kx-signal-card.warm { border-left-color: var(--mustard); }
  .kx-signal-card.cold { border-left-color: var(--dark-teal); }
  .kx-signal-card-input {
    width: 100%;
    border: none; outline: none; background: transparent;
    font-family: 'Figtree', sans-serif;
    font-size: 12.5px; line-height: 1.4;
    font-weight: 600;
    color: var(--midnight);
    padding: 2px 0 4px;
    resize: none;
    overflow: hidden;
    display: block;
  }
  .kx-signal-card-input::placeholder { color: var(--muted); font-weight: 500; }
  .kx-signal-card-input:focus {
    box-shadow: inset 0 -1px 0 var(--green);
  }
  .kx-signal-card-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px;
    gap: 8px;
  }
  .kx-signal-card-remove {
    background: none; border: none; padding: 4px;
    color: var(--muted); cursor: pointer;
    opacity: 0; transition: opacity 0.15s, color 0.15s;
    display: inline-flex; flex-shrink: 0;
    border-radius: 4px;
  }
  .kx-signal-card:hover .kx-signal-card-remove { opacity: 0.85; }
  .kx-signal-card-remove:hover { color: var(--rust); background: #FDF3F1; opacity: 1; }

  /* segmented weight picker */
  .kx-weight-seg {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
  }
  .kx-weight-seg-btn {
    padding: 4px 10px;
    border: none;
    background: transparent;
    font-family: 'Figtree', sans-serif;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--muted);
    cursor: pointer;
    border-right: 1px solid var(--border);
    transition: background 0.12s, color 0.12s;
  }
  .kx-weight-seg-btn:last-child { border-right: none; }
  .kx-weight-seg-btn:hover:not(.active) { background: #FBF9F2; color: var(--midnight); }
  .kx-weight-seg-btn.active.hot  { background: var(--green-deep); color: #fff; }
  .kx-weight-seg-btn.active.warm { background: var(--mustard);    color: #fff; }
  .kx-weight-seg-btn.active.cold { background: var(--dark-teal);  color: #fff; }

  /* inline compose card for a new signal */
  .kx-signal-card.compose {
    border: 1px solid var(--green);
    border-left: 3px solid var(--green);
    background: #F6FCF9;
    box-shadow: 0 2px 8px rgba(65,187,147,0.15);
  }
  .kx-compose-actions {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .kx-btn-mini {
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.06em;
    padding: 5px 10px; border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: filter 0.12s, background 0.12s, border-color 0.12s;
  }
  .kx-btn-mini.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid transparent;
  }
  .kx-btn-mini.ghost:hover { color: var(--midnight); background: #fff; border-color: var(--border); }
  .kx-btn-mini.primary {
    background: var(--green); color: #fff; border: none;
  }
  .kx-btn-mini.primary:hover { filter: brightness(0.92); }
  .kx-btn-mini.primary:disabled { opacity: 0.5; cursor: not-allowed; filter: none; }

  .kx-rubric-add {
    margin-top: 10px;
    width: 100%; justify-content: center;
    padding: 10px 12px; font-size: 11.5px;
    background: #fff; color: var(--midnight);
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer;
    font-family: 'Figtree', sans-serif; font-weight: 600;
    letter-spacing: 0.02em;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .kx-rubric-add:hover {
    background: #F6FCF9;
    border-color: var(--green);
    color: var(--green-deep);
  }

  /* ---- Commit / CRM screen ---- */
  .kx-commit-wrap { width: 100%; }
  .kx-commit-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(15,35,69,0.05), 0 4px 14px rgba(15,35,69,0.03);
    transition: box-shadow 0.15s;
  }
  .kx-commit-card:hover { box-shadow: 0 2px 6px rgba(15,35,69,0.08), 0 8px 22px rgba(15,35,69,0.05); }
  .kx-commit-card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 6px;
  }
  .kx-commit-card-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px; font-weight: 700; color: var(--midnight); margin: 0;
  }
  .kx-commit-card-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-top: 12px;
    padding-top: 10px; border-top: 1px dashed var(--border);
    font-family: 'Figtree', sans-serif;
    font-size: 11px; color: var(--muted);
  }
  .kx-commit-id {
    letter-spacing: 0.04em;
    color: var(--midnight);
    background: #F5F3EE;
    padding: 3px 8px; border-radius: 4px;
    border: 1px solid var(--border);
    font-family: 'Consolas', monospace;
  }
  .kx-commit-id b { color: var(--bright-blue); }

  /* ---- Review editorial dossier ---- */
  .kx-review { width: 100%; }
  /* Title, band chip, and score all flow inline inside the same <h1> so the
     badge + score always trail the LAST line of the title — no matter whether
     the title wraps to one line or two. */
  .kx-review-hero-row {
    display: block;
  }
  .kx-review-hero-row .kx-h1 {
    font-size: 24px; letter-spacing: -0.02em;
    line-height: 1.2;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  /* Wrap band chip + numeric score in a single nowrap island so the two
     tokens always sit shoulder-to-shoulder — never split across lines on
     narrow viewports. The island itself may drop to the next line under
     the title, but its internal pieces stay together. */
  .kx-h1-scorepack {
    display: inline-block;
    white-space: nowrap;
    margin-left: 12px;
    vertical-align: 0.14em;
  }
  .kx-review-hero-row .kx-h1 .kx-h1-scorepack .kx-badge {
    vertical-align: baseline;
  }
  .kx-review-hero-row .kx-h1 .kx-h1-scorepack .kx-score-num {
    margin-left: 10px;
    vertical-align: baseline;
  }

  /* Inline attendees + date meta row (single icon representing attendees) */
  .kx-meta-inline {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 10px 12px;
    font-family: 'Figtree', sans-serif;
    font-size: 13px; color: var(--muted);
    margin: 8px 0 14px;
  }
  .kx-meta-attendees {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--muted);
    font-family: 'Figtree', sans-serif;
    font-size: 13px;
    font-weight: 500;
  }
  .kx-meta-attendees .kx-meta-attendee-names {
    color: var(--muted);
  }
  .kx-meta-dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: var(--border-strong);
    display: inline-block;
  }
  .kx-meta-date {
    font-family: 'Figtree', sans-serif;
    font-size: 13px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  /* Inline prospect email — mandatory input threaded into the meta row.
     Matches meta typography exactly so the row reads as one strip.
     Required-ness is signalled by a small rust asterisk (universal convention)
     and enforced by disabling the Approve button until filled. */
  .kx-meta-email {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: 'Figtree', sans-serif;
    font-size: 13px;
  }
  .kx-meta-email .kx-meta-email-icon { color: var(--muted); flex-shrink: 0; }
  .kx-meta-email-star {
    color: var(--rust);
    font-family: 'Figtree', sans-serif;
    font-size: 13px; font-weight: 700;
    line-height: 1; margin-left: -1px; margin-right: 1px;
    user-select: none;
  }
  .kx-meta-email-input {
    background: transparent; border: none;
    border-bottom: 1px dashed var(--border-strong);
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: var(--midnight);
    padding: 1px 2px;
    min-width: 200px;
    transition: border-color 0.15s;
  }
  .kx-meta-email-input:focus { border-color: var(--green); }
  .kx-meta-email-input::placeholder { color: var(--border-strong); font-style: italic; opacity: 1; }

  /* Compact contact strip — single row, minimal footprint */
  .kx-contact-compact {
    display: inline-flex; align-items: center; flex-wrap: wrap;
    gap: 6px 14px;
    background: #FBF9F2;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 14px;
    margin: 4px 0 20px;
  }
  .kx-contact-item {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Figtree', sans-serif;
    font-size: 13px; color: var(--midnight);
    font-weight: 500;
    line-height: 1.3;
  }
  .kx-contact-item.name { font-weight: 700; }
  .kx-contact-item .kx-contact-icon { color: var(--muted); flex-shrink: 0; }
  .kx-contact-item a { color: var(--bright-blue); text-decoration: none; }
  .kx-contact-item a:hover { text-decoration: underline; }
  .kx-contact-item-muted { color: var(--muted); }
  .kx-contact-item-empty {
    color: var(--rust); font-style: italic; cursor: pointer;
    font-size: 12.5px;
  }
  .kx-contact-item-empty:hover { text-decoration: underline; }
  .kx-contact-sep {
    color: var(--border-strong);
    font-size: 11px;
    user-select: none;
  }
  .kx-contact-inline-input {
    background: transparent; border: none;
    border-bottom: 1px dashed var(--border-strong);
    outline: none;
    font-family: inherit; font-size: inherit; color: var(--midnight);
    padding: 1px 4px;
    min-width: 120px;
    transition: border-color 0.15s;
  }
  .kx-contact-inline-input:focus { border-color: var(--green); }
  .kx-contact-inline-input.warn { border-color: var(--rust); }
  .kx-review-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(65,187,147,0.14);
    border: 1px solid rgba(65,187,147,0.4);
    color: var(--green-deep);
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .kx-bar-h1 {
    width: 112px; height: 10px; border-radius: 2px;
    background: var(--midnight);
    margin: 14px 0 12px;
  }
  .kx-bar-h2 {
    width: 72px; height: 6px; border-radius: 2px;
    background: var(--bright-blue);
    margin: 8px 0 16px;
  }

  /* ---- Banding tiles ---- */
  .kx-band-stack {
    display: flex; flex-direction: column; gap: 10px;
    margin-top: 10px;
  }
  .kx-band-tile {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #FCFAF4;
    position: relative;
    overflow: hidden;
  }
  .kx-band-tile::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  }
  .kx-band-tile.hot::before { background: var(--green-deep); }
  .kx-band-tile.warm::before { background: var(--mustard); }
  .kx-band-tile.cold::before { background: var(--dark-teal); }
  .kx-band-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700; font-size: 13px;
    color: #fff;
  }
  .kx-band-tile.hot .kx-band-dot { background: var(--green-deep); }
  .kx-band-tile.warm .kx-band-dot { background: var(--mustard); }
  .kx-band-tile.cold .kx-band-dot { background: var(--dark-teal); }
  .kx-band-body { min-width: 0; }
  .kx-band-label {
    font-family: 'Figtree', sans-serif;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--midnight);
    margin-bottom: 3px;
  }
  .kx-band-rule {
    font-size: 12px; line-height: 1.45; color: var(--muted);
  }
  .kx-band-edit-row {
    display: flex; justify-content: flex-end; margin-top: 6px;
  }
  .kx-band-edit-btn {
    background: none; border: none; padding: 4px 6px;
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--bright-blue); cursor: pointer;
  }
  .kx-band-edit-btn:hover { text-decoration: underline; }
  .kx-meta {
    font-family: 'Figtree', sans-serif;
    font-size: 13px; color: var(--muted);
    margin-bottom: 22px;
  }
  .kx-eyebrow-inline {
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 800;
    color: var(--mustard);
    text-transform: uppercase; letter-spacing: 0.14em;
    margin-bottom: 4px;
  }
  .kx-h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px; font-weight: 700; color: var(--midnight);
    letter-spacing: -0.01em; margin: 2px 0 0;
  }
  /* Unified small section title — mustard/golden to match the "MEETING SUMMARY" eyebrow.
     Same font/size/color everywhere; no bar underline. */
  .kx-h2-sm {
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 800;
    color: var(--mustard);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  /* Review hero block — SUMMARY eyebrow + meeting title live in the left column;
     action buttons pin to the top-right. When the title is long it wraps within
     the left column and extends under the button row without pushing the eyebrow
     down or opening a gap between it and the title. */
  .kx-review-hero-block-wrap {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }
  .kx-review-hero-block-main {
    min-width: 0;
    flex: 1 1 auto;
  }
  .kx-review-hero-block-main .kx-eyebrow {
    margin: 0 0 6px;
    line-height: 1;
  }
  .kx-review-hero-block-main .kx-review-hero-row {
    margin-top: 0;
  }
  .kx-review-actions {
    display: inline-flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    margin-top: 2px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* Review hero — scaling for narrow viewports so the title + score island
     fit without collision. Action buttons drop under the title on the tightest
     widths, giving the h1 the full row to itself. */
  @media (max-width: 900px) {
    .kx-review-hero-row .kx-h1 { font-size: 22px; }
    .kx-h1-scorepack { margin-left: 10px; }
    .kx-review-hero-row .kx-h1 .kx-h1-scorepack .kx-score-num { margin-left: 8px; }
  }
  @media (max-width: 640px) {
    .kx-review-hero-block-wrap {
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
    }
    .kx-review-actions {
      justify-content: flex-start;
    }
    .kx-review-hero-row .kx-h1 { font-size: 20px; line-height: 1.25; }
  }
  @media (max-width: 400px) {
    .kx-review-hero-row .kx-h1 { font-size: 18px; }
    .kx-h1-scorepack { margin-left: 8px; }
    .kx-review-hero-row .kx-h1 .kx-h1-scorepack .kx-score-num { margin-left: 6px; }
  }

  /* Score numeric — colored by band, no chip, no background, no border */
  .kx-score-num {
    display: inline-flex; align-items: baseline; gap: 1px;
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .kx-score-num b {
    font-size: 22px; font-weight: 700;
  }
  .kx-score-num .kx-score-total {
    font-size: 13px; font-weight: 500;
    color: var(--muted);
    margin-left: 1px;
  }
  .kx-score-num.hot  b { color: var(--green-deep); }
  .kx-score-num.warm b { color: var(--mustard);    }
  .kx-score-num.cold b { color: var(--dark-teal);  }
  @media (max-width: 900px) {
    .kx-score-num b { font-size: 20px; }
  }
  @media (max-width: 640px) {
    .kx-score-num b { font-size: 18px; }
    .kx-score-num .kx-score-total { font-size: 12px; }
  }
  @media (max-width: 400px) {
    .kx-score-num b { font-size: 16px; }
    .kx-score-num .kx-score-total { font-size: 11px; }
  }

  .kx-contact-strip {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    background: #fff; border: 1px solid var(--border);
    border-radius: 4px; padding: 16px 20px;
    margin-bottom: 28px;
    box-shadow: 0 1px 3px rgba(15,35,69,0.05);
  }
  @media (max-width: 720px) { .kx-contact-strip { grid-template-columns: repeat(2, 1fr); } }
  .kx-contact-cell { min-width: 0; }
  .kx-contact-label {
    display: flex; align-items: center; gap: 6px;
    font-family: 'Figtree', sans-serif;
    font-size: 10px; font-weight: 800;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  .kx-contact-value {
    font-family: 'Figtree', sans-serif;
    font-size: 14px; font-weight: 500; color: var(--midnight);
    line-height: 1.35;
    overflow: hidden; text-overflow: ellipsis;
  }
  .kx-conf-dot {
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
  }
  .kx-conf-high { background: var(--green-deep); }
  .kx-conf-medium { background: var(--mustard); }
  .kx-conf-low { background: var(--rust); }
  .kx-confirm-pill {
    display: inline-block;
    font-size: 12px; font-weight: 600; color: var(--mustard);
    background: rgba(164,129,45,0.08);
    border: 1px dashed var(--mustard);
    padding: 3px 10px; border-radius: 2px;
    cursor: pointer;
  }
  .kx-confirm-pill:hover { background: rgba(164,129,45,0.14); }

  .kx-review-section { margin-top: 32px; }
  .kx-section-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 2px;
    margin-left: 3px;
  }
  .kx-section-actions { display: flex; gap: 12px; margin-top: 4px; }
  .kx-link-btn {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: 'Figtree', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--green-deep);
    text-transform: none; letter-spacing: 0;
  }
  .kx-link-btn:hover { color: var(--green); text-decoration: underline; }

  .kx-signal-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 12px;
  }
  .kx-signal-chip {
    display: inline-flex; align-items: center;
    background: #F0EDE5;
    border: 1px solid var(--tan);
    color: var(--midnight);
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
  }
  .kx-rationale {
    font-size: 13px; color: var(--text); line-height: 1.6;
    margin: 0; max-width: 620px;
  }

  .kx-doc-list { margin: 0; padding: 0; list-style: none; }
  .kx-doc-list li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 13.5px; line-height: 1.55; color: var(--text);
    padding: 6px 0;
  }
  .kx-doc-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--mustard);
    margin-top: 8px; flex-shrink: 0;
  }
  .kx-doc-check { color: var(--green-deep); margin-top: 2px; flex-shrink: 0; }

  .kx-attendee-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .kx-attendee-row:last-child { border-bottom: none; }
  .kx-side-chip {
    font-family: 'Figtree', sans-serif;
    font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 10px; border-radius: 2px;
    color: #fff;
  }
  .kx-side-chip.kaffea { background: var(--mustard); }
  .kx-side-chip.prospect { background: var(--green); }

  .kx-nextstep-card {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid var(--border);
    border-radius: 4px; padding: 12px 16px;
    margin-bottom: 8px; gap: 12px;
  }
  .kx-nextstep-owner {
    font-family: 'Figtree', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(164,129,45,0.14); color: var(--mustard);
    padding: 4px 10px; border-radius: 2px;
  }
  .kx-due-pill {
    font-size: 11px; font-weight: 600; color: var(--midnight);
    background: #F0EDE5; border: 1px solid var(--tan);
    padding: 3px 10px; border-radius: 20px;
    margin-left: 6px;
  }

  .kx-question-card {
    display: flex; align-items: flex-start; gap: 10px;
    background: rgba(164,129,45,0.08);
    border: 1px solid rgba(164,129,45,0.35);
    border-radius: 4px; padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 13px; color: var(--midnight); line-height: 1.5;
  }

  .kx-letter {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 24px 28px;
    box-shadow: 0 2px 8px rgba(15,35,69,0.05);
    max-width: 640px;
  }
  .kx-letter-subject {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 16px; font-weight: 700; color: var(--midnight);
    margin-bottom: 12px;
  }
  .kx-letter-rule {
    border: none; border-top: 1px solid var(--border);
    margin: 0 0 16px;
  }
  .kx-letter-body {
    white-space: pre-wrap;
    font-family: 'Figtree', sans-serif;
    font-size: 13.5px; line-height: 1.7; color: var(--text);
  }

  .kx-review-note {
    font-size: 13px; color: var(--muted);
    max-width: none;
    line-height: 1.5;
  }

  /* ---- Top action bar (opposite the hero heading) ---- */
  .kx-review-hero-block {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .kx-review-hero-left { min-width: 0; flex: 1 1 240px; }
  .kx-review-hero-right {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* ---- Narrative summary block ---- */
  .kx-narrative {
    font-family: 'Figtree', sans-serif;
    font-size: 15px; line-height: 1.7; color: var(--text);
    padding: 20px 24px;
    background: linear-gradient(180deg, #FDFBF5 0%, #FFFFFF 100%);
    border-left: 3px solid var(--midnight);
    border-radius: 0 8px 8px 0;
    box-shadow: 0 1px 3px rgba(15,35,69,0.04);
    margin-top: 4px;
  }

  /* ---- Metrics chips (weight-coloured) ---- */
  .kx-metric-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 4px;
  }
  .kx-metric-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 6px;
    font-family: 'Figtree', sans-serif;
    font-size: 12.5px; font-weight: 600; color: var(--midnight);
    cursor: default;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .kx-metric-chip:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(15,35,69,0.08); }
  .kx-metric-chip.hot  { border-left-color: var(--green-deep); }
  .kx-metric-chip.warm { border-left-color: var(--mustard); }
  .kx-metric-chip.cold { border-left-color: var(--dark-teal); }
  .kx-metric-chip-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .kx-metric-chip.hot  .kx-metric-chip-dot { background: var(--green-deep); }
  .kx-metric-chip.warm .kx-metric-chip-dot { background: var(--mustard); }
  .kx-metric-chip.cold .kx-metric-chip-dot { background: var(--dark-teal); }

  /* ---- Attendee grid (org badge sits inline with name) ---- */
  .kx-attendee-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    margin-top: 4px;
  }
  .kx-attendee-card {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  .kx-attendee-card:hover { box-shadow: 0 2px 8px rgba(15,35,69,0.06); }
  .kx-attendee-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Figtree', sans-serif;
    font-size: 12px; font-weight: 800;
    color: #fff; flex-shrink: 0;
  }
  .kx-attendee-avatar.kaffea   { background: var(--midnight); }
  .kx-attendee-avatar.prospect { background: var(--green-deep); }
  .kx-attendee-body { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .kx-attendee-name {
    font-size: 14px; font-weight: 600; color: var(--midnight);
    line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kx-attendee-org {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted);
  }
  .kx-attendee-org.kaffea   { color: var(--midnight); }
  .kx-attendee-org.prospect { color: var(--green-deep); }
  .kx-attendee-org-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  /* ---- Two-column bullet grid for topics & decisions ---- */
  .kx-bullet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 10px 24px;
    margin-top: 4px;
  }
  .kx-bullet-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13.5px; line-height: 1.55; color: var(--midnight);
  }
  .kx-bullet-item.decision { border-left: 3px solid var(--green-deep); }
  .kx-bullet-item.topic    { border-left: 3px solid var(--mustard); }
  .kx-bullet-item-icon { flex-shrink: 0; margin-top: 2px; }

  /* ---- Side-by-side card pair for topics + decisions (Option B treatment) ---- */
  .kx-b-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 2px;
  }
  @media (max-width: 900px) { .kx-b-pair { grid-template-columns: 1fr; } }
  .kx-b-pair-col { min-width: 0; display: flex; flex-direction: column; }
  .kx-b-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 18px;
    box-shadow: 0 1px 2px rgba(15,35,69,0.06);
    flex: 1;
  }
  .kx-b-card ul { list-style: none; margin: 0; padding: 0; }
  .kx-b-card li {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13.5px; line-height: 1.55;
    color: #1B2E4E;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .kx-b-card li:last-child { border-bottom: none; }
  .kx-b-num {
    flex-shrink: 0;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Consolas', 'IBM Plex Mono', monospace;
    font-size: 10px; font-weight: 700;
    margin-top: 1px;
  }
  .kx-b-num.topic    { background: rgba(65,187,147,0.18); color: var(--green-deep); }
  .kx-b-num.decision { background: rgba(15,35,69,0.10);   color: var(--midnight);   }
  .kx-b-num.action   { background: rgba(214,168,54,0.22); color: #6C4A00;           }
  /* Action-item rows read a bit larger than topics/decisions — they are the
     "do this next" of the meeting, so the type earns a little more weight.
     The due-date chip sits inline right after the statement, not pushed to the edge. */
  .kx-action-body {
    display: block;
    font-size: 15px; line-height: 1.6;
    color: var(--midnight);
    min-width: 0;
  }
  .kx-action-text { color: var(--midnight); }
  .kx-action-owner {
    color: var(--midnight); font-weight: 700;
    margin-right: 2px;
  }
  .kx-action-due-chip {
    margin-left: 8px;
    vertical-align: 1px;
  }
  .kx-b-empty { padding: 14px 2px; font-size: 13px; color: var(--muted); font-style: italic; }

  /* ---- Small inline signal chips (rendered under the narrative summary) ---- */
  .kx-signal-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 12px;
  }
  .kx-signal-chip {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 20px;
    font-family: 'Figtree', sans-serif;
    font-size: 11.5px; font-weight: 700;
    white-space: nowrap;
  }
  .kx-signal-chip.hot  { background: rgba(183,91,52,0.14);  color: var(--rust); }
  .kx-signal-chip.warm { background: rgba(164,129,45,0.14); color: var(--mustard); }
  .kx-signal-chip.cold { background: rgba(15,35,69,0.06);   color: var(--midnight); }

  /* ---- "What we heard" — signals grouped by weight (Option D).
     Three columns spatially encode HOT / WARM / COLD. Each row reveals
     the transcript snippet that fired the signal via a hover popover. */
  .kx-heard-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .kx-heard-tally {
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }
  .kx-heard-tally b { font-weight: 800; margin-left: 4px; }
  .kx-heard-tally b.hot  { color: var(--green-deep); }
  .kx-heard-tally b.warm { color: var(--mustard); }
  .kx-heard-tally b.cold { color: var(--dark-teal); }

  .kx-heard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .kx-heard-col {
    background: #fff;
    border: 1px solid var(--border);
    border-top: 3px solid var(--midnight);
    border-radius: 6px;
    padding: 10px 12px 12px;
    min-width: 0;
    box-shadow: 0 1px 2px rgba(15,35,69,0.04);
  }
  .kx-heard-col.hot  { border-top-color: var(--green-deep); }
  .kx-heard-col.warm { border-top-color: var(--mustard); }
  .kx-heard-col.cold { border-top-color: var(--dark-teal); }

  .kx-heard-col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 8px;
  }
  .kx-heard-col-title {
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  .kx-heard-col.hot  .kx-heard-col-title { color: var(--green-deep); }
  .kx-heard-col.warm .kx-heard-col-title { color: var(--mustard); }
  .kx-heard-col.cold .kx-heard-col-title { color: var(--dark-teal); }
  .kx-heard-col-count {
    font-family: 'Figtree', sans-serif;
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.06em;
  }

  .kx-heard-col ul { list-style: none; padding: 0; margin: 0; }
  .kx-heard-item {
    font-family: 'Figtree', sans-serif;
    font-size: 12.5px; font-weight: 500;
    color: var(--midnight);
    line-height: 1.35;
    padding: 6px 0;
    border-bottom: 1px dotted rgba(196,187,166,0.5);
    cursor: help;
    position: relative;
  }
  .kx-heard-item:last-child { border-bottom: none; }
  .kx-heard-item.empty {
    color: var(--muted);
    font-style: italic;
    cursor: default;
  }
  .kx-heard-item:hover:not(.empty) {
    color: var(--dark-blue);
  }

  .kx-heard-evidence {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    min-width: 220px;
    max-width: 320px;
    padding: 10px 12px;
    background: var(--midnight);
    color: #fff;
    border-radius: 6px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 13px; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(15,35,69,0.22);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.14s, visibility 0.14s;
    z-index: 20;
    white-space: normal;
  }
  .kx-heard-evidence::after {
    content: "";
    position: absolute;
    top: 100%; left: 18px;
    border: 6px solid transparent;
    border-top-color: var(--midnight);
  }
  .kx-heard-item:hover .kx-heard-evidence {
    opacity: 1;
    visibility: visible;
  }

  .kx-heard-reason {
    margin: 2px 0 12px;
    font-family: 'Figtree', sans-serif;
    font-size: 13px; line-height: 1.55;
    color: var(--midnight);
  }

  @media (max-width: 720px) {
    .kx-heard-grid { grid-template-columns: 1fr; gap: 8px; }
    .kx-heard-evidence { max-width: none; right: 0; }

  .kx-b-items { display: flex; flex-direction: column; gap: 10px; }
  .kx-b-item-card {
    background: #fff;
    border: 1px solid var(--border);
    border-left: 3px solid var(--border-strong);
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(15,35,69,0.05);
    display: flex; flex-direction: column; gap: 10px;
  }
  .kx-b-item-card.step   { border-left-color: var(--green-deep); }
  .kx-b-item-card.commit-kaffea   { border-left-color: var(--midnight); }
  .kx-b-item-card.commit-prospect { border-left-color: var(--green-deep); }
  .kx-b-item-text {
    font-size: 13.5px; line-height: 1.5;
    color: #1B2E4E;
  }
  .kx-b-item-chips {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center;
  }

  /* ---- Table for next-steps + commitments ---- */
  .kx-data-table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 4px;
  }
  .kx-data-table thead {
    background: #FBF9F2;
  }
  .kx-data-table th {
    text-align: left;
    padding: 10px 14px;
    font-family: 'Figtree', sans-serif;
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .kx-data-table td {
    padding: 12px 14px;
    font-size: 13.5px; color: var(--midnight);
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
  }
  .kx-data-table tr:last-child td { border-bottom: none; }
  .kx-data-table tr:hover td { background: #FDFBF5; }
  .kx-owner-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 20px;
    background: rgba(15,35,69,0.06);
    font-family: 'Figtree', sans-serif;
    font-size: 11.5px; font-weight: 700;
    color: var(--midnight);
    white-space: nowrap;
  }
  .kx-owner-pill-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green-deep);
  }
  .kx-side-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 20px;
    font-family: 'Figtree', sans-serif;
    font-size: 10.5px; font-weight: 800;
    letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .kx-side-tag.kaffea   { background: rgba(15,35,69,0.08);   color: var(--midnight); }
  .kx-side-tag.prospect { background: rgba(65,187,147,0.14); color: var(--green-deep); }
  .kx-due-tag {
    display: inline-flex; align-items: center;
    padding: 3px 10px; border-radius: 20px;
    background: rgba(164,129,45,0.14);
    color: var(--mustard);
    font-family: 'Figtree', sans-serif;
    font-size: 11.5px; font-weight: 700;
    white-space: nowrap;
  }
  .kx-empty-cell {
    color: var(--muted); font-style: italic; font-size: 12.5px;
  }

  /* ---- Processing modal ---- */
  .kx-proc-overlay {
    position: fixed; inset: 0;
    background: rgba(15,35,69,0.35);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 60;
    display: flex; align-items: center; justify-content: center;
  }
  .kx-proc-card {
    background: #fff;
    border-radius: 4px;
    padding: 32px 36px;
    width: 460px; max-width: 92vw;
    box-shadow: 0 20px 60px rgba(15,35,69,0.2);
  }
  .kx-proc-row {
    display: flex; align-items: center; gap: 12px;
    margin-top: 16px;
  }
  .kx-proc-row:first-of-type { margin-top: 4px; }
  .kx-proc-icon {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .kx-proc-icon.pending { background: var(--card-bg); border: 1.5px solid var(--border-strong); color: var(--muted); }
  .kx-proc-icon.active {
    background: #FBEED0; border: 1.5px solid var(--mustard); color: var(--mustard);
    animation: kx-spin 1.4s linear infinite;
  }
  .kx-proc-icon.done { background: var(--green); border: 1.5px solid var(--green); color: #fff; }
  .kx-proc-label {
    flex: 1;
    font-family: 'Figtree', sans-serif;
    font-size: 13.5px; font-weight: 500;
    color: var(--muted);
  }
  .kx-proc-label.active { color: var(--midnight); font-weight: 700; }
  .kx-proc-label.done { color: var(--midnight); font-weight: 500; }
  .kx-proc-status { min-width: 46px; text-align: right; }
  .kx-proc-shimmers {
    margin: 12px 0 4px 40px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .kx-shimmer {
    height: 8px; border-radius: 2px;
    background: linear-gradient(90deg, #EDE7D8 0%, #FAF6EA 50%, #EDE7D8 100%);
    background-size: 200% 100%;
    animation: kx-shimmer-slide 1.4s linear infinite;
  }
  @keyframes kx-shimmer-slide {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @keyframes kx-toast-in {
    from { opacity: 0; transform: translate(-50%, -8px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
  @keyframes kx-spin { to { transform: rotate(360deg); } }
  .kx-spin { animation: kx-spin 1s linear infinite; }
  @keyframes kx-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes kx-chat-slide-up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

function buildMeetingTitle(band, company) {
  const c = company || "prospect";

  if (band === "warm") return `Intro conversation — ${c}`;

function makeSeed({ id, company, name, title, email, band, when, committed, detected, rationale, meetingTitle }) {
  const contact = {
    name:    { value: name    || "",      confidence: name    ? "high" : "low" },
    company: { value: company || "",      confidence: "high" },
    title:   { value: title   || "",      confidence: title   ? "medium" : "low" },
    email:   { value: email   || "",      confidence: email   ? "medium" : "low" },
  };
  return {
    id, when, committed: !!committed, band,
    contact,
    summary: {
      meeting_title: meetingTitle || buildMeetingTitle(band, company),
      narrative: band === "hot"
        ? `${company} presented a strong buying case in this conversation, with the founder speaking openly about what isn't working in their current channel. The team walked through concrete pain around distribution and wholesale pricing visibility, describing the exact friction Kaffea-X is built to close. The discussion moved past introductions quickly and into specifics about how listings, benchmarks, and buyer discovery would work. A concrete 30-minute follow-up was agreed for next week, with the onboarding walkthrough and sample listings to land beforehand. Scored HOT because multiple qualifying signals fired against the rubric and a committed next step landed on the call.`
